<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajayi Knowledge Hub</title>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS & Supabase -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: '#0B1F3A',
                        emerald: '#2E8B57',
                        gold: '#D4AF37',
                        charcoal: '#121212',
                        cardDark: '#1E1E1E'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'slide-down': 'slideDown 0.3s ease-out forwards',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideDown: {
                            '0%': { opacity: '0', transform: 'translateY(-10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body::-webkit-scrollbar { width: 8px; }
        body::-webkit-scrollbar-track { background: transparent; }
        body::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        .dark body::-webkit-scrollbar-thumb { background-color: #334155; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-charcoal text-gray-900 dark:text-gray-100 transition-colors duration-300 antialiased font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, Fragment, Component } = React;

        // --- SUPABASE CONFIGURATION ---
        const supabaseUrl = 'https://ulqihwnzujncqpexersp.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVscWlod256dWpuY3FwZXhlcnNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNDIxNjMsImV4cCI6MjEwMDgxODE2M30.vvMQLeUtjVmciJxwqVgiFVZjmHlclY0Z-oHngY3SVso';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // --- ERROR BOUNDARY ---
        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            componentDidCatch(error, errorInfo) { console.error("Caught by ErrorBoundary:", error, errorInfo); }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-charcoal p-6">
                            <div className="bg-white dark:bg-cardDark p-8 rounded-2xl shadow-xl max-w-lg w-full text-center">
                                <h2 className="text-xl font-bold text-red-500 mb-2">Something went wrong</h2>
                                <p className="text-sm text-gray-600 dark:text-gray-400 mb-4">{this.state.error && this.state.error.toString()}</p>
                                <button onClick={() => window.location.reload()} className="px-6 py-2 bg-navy text-white rounded-full">Reload</button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const ParticleBackground = () => {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationFrameId;
                let particles = [];

                const resize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                };
                window.addEventListener('resize', resize);
                resize();

                class Microbe {
                    constructor() {
                        this.x = Math.random() * canvas.width;
                        this.y = Math.random() * canvas.height;
                        this.vx = (Math.random() - 0.5) * 0.4;
                        this.vy = (Math.random() - 0.5) * 0.4;
                        this.type = Math.floor(Math.random() * 3); // 0=Bacillus, 1=Coccus, 2=Spirillum
                        this.size = Math.random() * 3 + 2;
                        this.angle = Math.random() * Math.PI * 2;
                        this.spin = (Math.random() - 0.5) * 0.02;
                    }
                    update() {
                        this.x += this.vx;
                        this.y += this.vy;
                        this.angle += this.spin;
                        if (this.x < -50) this.x = canvas.width + 50;
                        if (this.x > canvas.width + 50) this.x = -50;
                        if (this.y < -50) this.y = canvas.height + 50;
                        if (this.y > canvas.height + 50) this.y = -50;
                    }
                    draw() {
                        ctx.save();
                        ctx.translate(this.x, this.y);
                        ctx.rotate(this.angle);
                        ctx.fillStyle = 'rgba(46, 139, 87, 0.4)';
                        ctx.strokeStyle = 'rgba(46, 139, 87, 0.4)';
                        ctx.lineWidth = 1.5;

                        if (this.type === 0) { // Bacillus (Rod)
                            ctx.beginPath();
                            ctx.roundRect(-this.size*2, -this.size, this.size*4, this.size*2, this.size);
                            ctx.fill();
                        } else if (this.type === 1) { // Diplococcus
                            ctx.beginPath();
                            ctx.arc(-this.size, 0, this.size, 0, Math.PI * 2);
                            ctx.arc(this.size, 0, this.size, 0, Math.PI * 2);
                            ctx.fill();
                        } else { // Spirillum (Wavy)
                            ctx.beginPath();
                            ctx.moveTo(-this.size*3, 0);
                            ctx.quadraticCurveTo(-this.size*1.5, -this.size*2, 0, 0);
                            ctx.quadraticCurveTo(this.size*1.5, this.size*2, this.size*3, 0);
                            ctx.stroke();
                        }
                        ctx.restore();
                    }
                }

                for (let i = 0; i < 35; i++) particles.push(new Microbe());

                const animate = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles.forEach(p => { p.update(); p.draw(); });
                    
                    // Network Lines (Mycelium/Biofilm effect)
                    particles.forEach((p1, i) => {
                        particles.slice(i + 1).forEach(p2 => {
                            const dx = p1.x - p2.x;
                            const dy = p1.y - p2.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 120) {
                                ctx.beginPath();
                                ctx.moveTo(p1.x, p1.y);
                                ctx.lineTo(p2.x, p2.y);
                                ctx.strokeStyle = `rgba(46, 139, 87, ${0.2 - dist/600})`;
                                ctx.lineWidth = 0.5;
                                ctx.stroke();
                            }
                        });
                    });
                    animationFrameId = requestAnimationFrame(animate);
                };
                animate();
                return () => { window.removeEventListener('resize', resize); cancelAnimationFrame(animationFrameId); };
            }, []);

            return <canvas ref={canvasRef} className="absolute inset-0 z-0 pointer-events-none" />;
        };

        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                book: <Fragment><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><path d="M8 7h6"/><path d="M8 11h8"/></Fragment>,
                microscope: <Fragment><path d="M6 18h8 M3 22h18 M14 22a7 7 0 1 0 0-14h-1 M9 14h2 M9 12a2 2 0 0 1-2-2V6h6v4a2 2 0 0 1-2 2Z M12 6V3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3"/></Fragment>,
                gradCap: <Fragment><path d="M22 10v6M2 10l10-5 10 5-10 5z M6 12v5c3 3 9 3 12 0v-5"/></Fragment>,
                pencil: <Fragment><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z M15 5l4 4"/></Fragment>,
                menu: <Fragment><path d="M4 12h16M4 6h16M4 18h16"/></Fragment>,
                x: <Fragment><path d="M18 6 6 18M6 6l12 12"/></Fragment>,
                sun: <Fragment><path d="M12 3v1M12 20v1M4.22 4.22l.71.71M19.07 19.07l.71.71M1 12h1M20 12h1M4.22 19.78l.71-.71M19.07 4.93l.71-.71M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10z"/></Fragment>,
                moon: <Fragment><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></Fragment>,
                download: <Fragment><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M7 10l5 5 5-5 M12 15V3"/></Fragment>,
                layout: <Fragment><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></Fragment>,
                users: <Fragment><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></Fragment>,
                chart: <Fragment><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></Fragment>,
                search: <Fragment><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Fragment>,
                sparkles: <Fragment><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></Fragment>,
                arrowLeft: <Fragment><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></Fragment>,
                send: <Fragment><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></Fragment>,
                bot: <Fragment><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></Fragment>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name]}
                </svg>
            );
        };

        const Navbar = ({ darkMode, setDarkMode, navigateTo, currentView, setShowSearch }) => {
            const [mobileMenu, setMobileMenu] = useState(false);
            const navLinks = [
                { name: 'Library', id: 'library' },
                { name: 'Research', id: 'research' },
                { name: 'Journal', id: 'journal' },
                { name: 'Teaching', id: 'teaching' },
                { name: 'Blog', id: 'blog' },
                { name: 'Projects', id: 'projects' },
                { name: 'About', id: 'about' },
                { name: 'Contact', id: 'contact' },
            ];

            return (
                <nav className="bg-[#0B1423] text-white border-b border-white/10 w-full fixed top-0 z-50">
                    <div className="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex justify-between items-center h-20">
                            {/* Logo synced with Footer style */}
                            <div className="flex-shrink-0 cursor-pointer flex items-center gap-3 group" onClick={() => navigateTo('home')}>
                                <div className="text-[#D4AF37] group-hover:scale-105 transition-transform">
                                    <Icon name="book" size={32} />
                                </div>
                                <div className="flex flex-col">
                                    <h1 className="font-serif font-bold text-xl leading-tight">Ajayi Knowledge Hub</h1>
                                    <span className="text-[#D4AF37] text-[10px] tracking-wider uppercase font-medium">Explore. Learn. Discover. Grow.</span>
                                </div>
                            </div>
                            
                            {/* Desktop Nav */}
                            <div className="hidden xl:flex space-x-6 items-center">
                                {navLinks.map(link => (
                                    <button key={link.id} onClick={() => navigateTo(link.id)} className={`font-medium text-sm transition-colors pb-1 border-b-2 ${currentView === link.id ? 'text-[#D4AF37] border-[#D4AF37]' : 'text-gray-300 hover:text-white border-transparent hover:border-gray-500'}`}>
                                        {link.name}
                                    </button>
                                ))}
                                <a href="/admin.html" className="font-medium text-sm text-gray-300 hover:text-white transition-colors pb-1 border-b-2 border-transparent hover:border-gray-500">
                                    Admin Login
                                </a>
                            </div>

                            {/* Actions */}
                            <div className="flex items-center space-x-3">
                                {/* AI Button (Hidden on mobile, uses floating bubble instead) */}
                                <button onClick={() => navigateTo('ai')} className="hidden md:flex px-4 py-2 rounded-lg bg-emerald/20 border border-emerald/50 text-emerald-400 hover:bg-emerald/30 text-sm font-medium transition-colors items-center gap-2">
                                    <Icon name="sparkles" size={16} /> Ask AI
                                </button>
                                
                                <button onClick={() => setShowSearch(true)} className="w-10 h-10 rounded-xl bg-white/10 border border-white/20 flex items-center justify-center text-white hover:bg-white/20 transition-all shadow-md">
                                    <Icon name="search" size={18} />
                                </button>
                                <button onClick={() => setDarkMode(!darkMode)} className="hidden sm:flex w-10 h-10 rounded-xl bg-white/10 border border-white/20 items-center justify-center text-white hover:bg-white/20 transition-all shadow-md">
                                    {darkMode ? <Icon name="sun" size={18} /> : <Icon name="moon" size={18} />}
                                </button>
                                
                                {/* High Visibility Mobile Menu Toggle */}
                                <button onClick={() => setMobileMenu(!mobileMenu)} className="xl:hidden w-10 h-10 rounded-xl bg-white/10 border border-white/20 flex items-center justify-center text-white hover:bg-white/20 transition-all shadow-md">
                                    <Icon name={mobileMenu ? "x" : "menu"} size={22} />
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Solid Background Mobile Menu */}
                    {mobileMenu && (
                        <div className="xl:hidden absolute top-20 left-0 w-full bg-[#0B1423] shadow-2xl animate-slide-down border-b border-white/10 z-50">
                            <div className="px-4 py-4 space-y-1">
                                {navLinks.map(link => (
                                    <button key={link.id} onClick={() => { navigateTo(link.id); setMobileMenu(false); }} className={`block w-full text-left px-4 py-3 rounded-xl text-sm font-medium ${currentView === link.id ? 'bg-white/10 text-[#D4AF37]' : 'text-gray-300 hover:bg-white/5 hover:text-white'}`}>
                                        {link.name}
                                    </button>
                                ))}
                                <a href="/admin.html" onClick={() => setMobileMenu(false)} className="block w-full text-left px-4 py-3 rounded-xl text-sm font-medium text-gray-300 hover:bg-white/5 hover:text-white">
                                    Admin Login
                                </a>
                                <div className="pt-4 mt-2 border-t border-white/10 flex gap-4">
                                    <button onClick={() => setDarkMode(!darkMode)} className="flex-1 py-3 rounded-xl bg-white/5 border border-white/10 text-white flex justify-center items-center gap-2 font-medium">
                                        {darkMode ? <Icon name="sun" size={18} /> : <Icon name="moon" size={18} />} Theme
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </nav>
            );
        };

        const HeroSection = ({ settings, navigateTo }) => (
            <section className="relative pt-32 pb-24 flex items-center justify-center bg-[#0B1423] text-white overflow-hidden min-h-[80vh]">
                <ParticleBackground />
                <div className="absolute inset-0 z-0 bg-[url('https://images.unsplash.com/photo-1532094349884-543bc11b234d?auto=format&fit=crop&q=80')] bg-cover bg-center opacity-20 mix-blend-overlay"></div>
                <div className="absolute inset-0 z-0 bg-gradient-to-b from-[#0B1423]/80 via-[#0B1423]/60 to-[#0B1423]"></div>
                
                <div className="relative z-10 container mx-auto px-6 text-center max-w-5xl animate-fade-in">
                    <h1 className="font-serif text-5xl md:text-7xl font-bold mb-6 leading-tight tracking-tight">
                        {settings?.hero_title ? (
                            <span dangerouslySetInnerHTML={{ __html: settings.hero_title.replace('grows', '<span class="text-[#2E8B57]">grows</span>').replace('matters', '<span class="text-[#D4AF37]">matters</span>').replace('inspire', '<span class="text-[#8B9C2A]">inspire</span>') }} />
                        ) : (
                            <Fragment>Knowledge that <span className="text-[#2E8B57]">grows</span>.<br />Research that <span className="text-[#D4AF37]">matters</span>.<br />Ideas that <span className="text-[#8B9C2A]">inspire</span>.</Fragment>
                        )}
                    </h1>
                    <h2 className="text-xl md:text-2xl text-[#D4AF37] font-medium mb-6 font-serif">
                        {settings?.hero_subtitle || 'Welcome to my digital knowledge hub.'}
                    </h2>
                    <p className="text-base md:text-lg text-gray-300 mb-12 max-w-3xl mx-auto font-light leading-relaxed">
                        {settings?.mission_text || 'Here I share my books, scientific research, teaching materials, journals, articles, and ideas as I pursue a lifelong mission of learning, discovery, and service.'}
                    </p>
                    <div className="flex flex-wrap items-center justify-center gap-4">
                        <button onClick={() => navigateTo('library')} className="px-8 py-3.5 bg-[#2E8B57] hover:bg-[#257348] text-white text-sm font-semibold rounded-lg transition-all flex items-center gap-2 border border-[#2E8B57] shadow-lg">
                            <Icon name="book" size={18} /> Explore Library
                        </button>
                        <button onClick={() => navigateTo('research')} className="px-8 py-3.5 bg-transparent hover:bg-white/5 text-white text-sm font-semibold rounded-lg transition-all border border-blue-400/30 flex items-center gap-2">
                            <Icon name="microscope" size={18} /> Research Archive
                        </button>
                    </div>
                </div>
            </section>
        );

        const ContentCards = ({ publications, navigateTo, setSelectedItem }) => {
            const getLatest = (type) => publications.find(p => p.type === type);
            
            const handleRead = (item, view) => {
                if(!item) return;
                setSelectedItem(item);
                navigateTo(view);
            }

            const latestBook = getLatest('book');
            const latestResearch = getLatest('research');
            const latestBlog = getLatest('blog');

            return (
                <div className="bg-gray-50 dark:bg-[#121212] py-8 border-b border-gray-200 dark:border-gray-800">
                    <div className="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex flex-nowrap overflow-x-auto pb-6 gap-6 snap-x snap-mandatory hide-scrollbar">
                            
                            {/* Featured Book */}
                            {latestBook && (
                                <div className="snap-start shrink-0 w-[350px] md:w-[400px] bg-white dark:bg-[#1E1E1E] rounded-xl border border-gray-200 dark:border-gray-800 p-5 shadow-sm flex flex-col group">
                                    <div className="flex justify-between items-center mb-5 border-b border-gray-100 dark:border-gray-800 pb-3">
                                        <div className="flex items-center gap-2 font-serif font-bold text-lg dark:text-white">
                                            <Icon name="book" size={20} className="text-gray-700 dark:text-gray-300" /> Featured Book
                                        </div>
                                    </div>
                                    <div className="flex gap-4 flex-grow">
                                        <div className="w-1/3 shrink-0">
                                            {latestBook.thumbnail_url ? (
                                                <div className="bg-gray-200 rounded shadow-md aspect-[2/3] overflow-hidden">
                                                    <img src={latestBook.thumbnail_url} alt="Cover" className="object-cover object-center w-full h-full" />
                                                </div>
                                            ) : (
                                                <div className="bg-[#112435] p-2 rounded shadow-md aspect-[2/3] flex items-center justify-center text-center border-l-4 border-[#2E8B57]">
                                                    <div className="text-white">
                                                        <div className="text-sm font-serif font-bold leading-tight mb-2">{latestBook.title}</div>
                                                        <div className="w-8 h-[1px] bg-[#2E8B57] mx-auto"></div>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                        <div className="flex flex-col justify-between min-w-0">
                                            <div>
                                                <h4 className="font-serif font-bold text-lg mb-2 leading-tight dark:text-white truncate">{latestBook.title}</h4>
                                                <p className="text-sm text-gray-600 dark:text-gray-400 mb-2 line-clamp-3">{latestBook.summary}</p>
                                                <div className="text-xs text-[#2E8B57] font-medium truncate">{latestBook.category}</div>
                                            </div>
                                            <button onClick={() => handleRead(latestBook, 'detail')} className="mt-4 px-4 py-1.5 border border-gray-300 dark:border-gray-600 rounded text-sm font-medium hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors w-max dark:text-white">View Book</button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Latest Research */}
                            {latestResearch && (
                                <div className="snap-start shrink-0 w-[350px] md:w-[400px] bg-white dark:bg-[#1E1E1E] rounded-xl border border-gray-200 dark:border-gray-800 p-5 shadow-sm flex flex-col group">
                                    <div className="flex justify-between items-center mb-5 border-b border-gray-100 dark:border-gray-800 pb-3">
                                        <div className="flex items-center gap-2 font-serif font-bold text-lg dark:text-white">
                                            <Icon name="microscope" size={20} className="text-gray-700 dark:text-gray-300" /> Latest Research
                                        </div>
                                    </div>
                                    <div className="flex flex-col h-full">
                                        <div className="h-32 bg-gray-200 dark:bg-gray-700 rounded-lg mb-4 overflow-hidden relative">
                                            <img src={latestResearch.thumbnail_url || 'https://images.unsplash.com/photo-1576086213369-97a306d36557?auto=format&fit=crop&q=80'} className="absolute inset-0 w-full h-full object-cover object-center" />
                                        </div>
                                        <h4 className="font-serif font-bold text-base mb-1 leading-tight dark:text-white truncate">{latestResearch.title}</h4>
                                        <div className="text-xs text-gray-500 mb-2">{latestResearch.published_date}</div>
                                        <p className="text-sm text-gray-600 dark:text-gray-400 mb-4 line-clamp-2 flex-grow">{latestResearch.summary}</p>
                                        <button onClick={() => handleRead(latestResearch, 'detail')} className="text-[#2E8B57] text-sm font-medium hover:underline text-left flex items-center gap-1">Read Now <span>&rarr;</span></button>
                                    </div>
                                </div>
                            )}

                            {/* Latest Blog */}
                            {latestBlog && (

            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const chatEndRef = useRef(null);

            const [form, setForm] = useState({ name: '', email: '', message: '' });

                e.preventDefault();
                if (!input.trim()) return;
                const userText = input;
                setInput('');
                setMessages(prev => [...prev, {role: 'user', text: userText}]);
                setLoading(true);

                try {
                    const apiKey = "AQ.Ab8RN6IldjSaVWI-DFOKeypexneKZeGmpP32V-ePaOm3S2iLvw"; 
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                    const systemPrompt = `You are Juedsola, the official AI Assistant for Paul Olakiitan Ajayi's Knowledge Hub. You speak on behalf of Paul.
                    Paul is a Microbiologist, Researcher, and Educator.
                    Here is his profile: ${JSON.stringify(settings)}
                    Here is his published library: ${JSON.stringify(publications.map(p=>({title: p.title, type: p.type, summary: p.summary, category: p.category})))}.
                    Your job is to answer questions about Paul, summarize his research, and guide visitors.
                    CRITICAL RULE: If the user wants to contact Paul directly, book him, collaborate, or asks something you cannot answer, say EXACTLY THIS: "I will need Paul to look into this. Please use the 'Direct Inbox' panel next to our chat to send him a direct message so he can reply via email."
                    Be polite, professional, and concise. Format text neatly.`;

                    const historyForApi = messages.filter(m => m.text).map(m => ({
                        role: m.role === 'ai' ? 'model' : 'user',
                        parts: [{ text: m.text }]
                    }));
                    historyForApi.push({ role: 'user', parts: [{ text: userText }] });

                    const payload = {
                        contents: historyForApi,
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    };

                    const res = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const data = await res.json();
                    const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "I am currently disconnected from my knowledge base. Please try again later, or use the Direct Inbox to message Paul.";

                    setMessages(prev => [...prev, {role: 'ai', text: aiText}]);
                } catch (err) {
                    setMessages(prev => [...prev, {role: 'ai', text: "Sorry, I encountered an error connecting to my servers. Please use the Direct Inbox if you need immediate assistance."}]);
                }
                setLoading(false);
            };

            const handleContactSubmit = async (e) => {
                e.preventDefault();
                setFormStatus('Sending...');
                try {
                    await supabase.from('messages').insert([form]);
                    setFormStatus('Sent successfully! Paul will be notified.');
                    setForm({ name: '', email: '', message: '' });
                } catch (error) { setFormStatus('Failed to send.'); }
                setTimeout(() => setFormStatus(''), 5000);
            };

                <div className="pt-24 pb-12 max-w-7xl mx-auto px-4 sm:px-6 min-h-screen animate-fade-in flex flex-col md:flex-row gap-8">

                        {/* Chat Header */}
                        <div className="p-4 border-b border-gray-100 dark:border-gray-800 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-full bg-emerald flex items-center justify-center text-white"><Icon name="bot" size={20}/></div>
                                <div>
                                    <h3 className="font-bold text-navy dark:text-white">Juedsola - AI Assistant</h3>
                                    <p className="text-xs text-emerald-500 font-medium">Online • Connected to Knowledge Base</p>
                                </div>
                            </div>
                            <button onClick={() => navigateTo('home')} className="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200"><Icon name="x" size={20}/></button>
                        </div>

                        {/* Messages Area */}
                        <div className="flex-1 overflow-y-auto p-4 space-y-4">
                            {messages.map((msg, idx) => (
                                <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`max-w-[80%] rounded-2xl p-4 ${msg.role === 'user' ? 'bg-navy text-white rounded-br-none' : 'bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-200 rounded-bl-none'}`}>
                                        <p className="whitespace-pre-wrap text-sm leading-relaxed">{msg.text}</p>
                                    </div>
                                </div>
                            ))}
                            {loading && (
                                <div className="flex justify-start">
                                    <div className="bg-gray-100 dark:bg-gray-800 rounded-2xl rounded-bl-none p-4 flex space-x-2 items-center">
                                        <div className="w-2 h-2 bg-emerald rounded-full animate-bounce"></div>
                                        <div className="w-2 h-2 bg-emerald rounded-full animate-bounce" style={{animationDelay: '0.2s'}}></div>
                                        <div className="w-2 h-2 bg-emerald rounded-full animate-bounce" style={{animationDelay: '0.4s'}}></div>
                                    </div>
                                </div>
                            )}
                            <div ref={chatEndRef} />
                        </div>

                        </form>

                        </form>

                </div>

                    await supabase.from('messages').insert([form]);
                    setStatus('Message sent successfully!');
                    setForm({ name: '', email: '', message: '' });
                } catch (error) { setStatus('Failed to send message.'); }
                setTimeout(() => setStatus(''), 5000);
            };

            return (
                <div className="max-w-3xl mx-auto px-4 pt-32 pb-24 min-h-screen animate-fade-in">
                    <button onClick={() => navigateTo('home')} className="flex items-center text-[#2E8B57] hover:opacity-80 mb-8 font-medium"><Icon name="arrowLeft" size={18} className="mr-2"/> Back to Home</button>
                    <div className="bg-white dark:bg-cardDark rounded-3xl p-8 shadow-xl border border-gray-100 dark:border-gray-800">
                        <h2 className="text-3xl font-bold font-serif dark:text-white mb-6">Send a Message</h2>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <input required type="text" placeholder="Your Name" value={form.name} onChange={e=>setForm({...form, name: e.target.value})} className="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-800 border-none dark:text-white focus:ring-2 focus:ring-[#2E8B57]" />
                            <input required type="email" placeholder="Your Email" value={form.email} onChange={e=>setForm({...form, email: e.target.value})} className="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-800 border-none dark:text-white focus:ring-2 focus:ring-[#2E8B57]" />
                            <textarea required rows="5" placeholder="Your Message" value={form.message} onChange={e=>setForm({...form, message: e.target.value})} className="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-800 border-none dark:text-white focus:ring-2 focus:ring-[#2E8B57]"></textarea>
                            <button type="submit" className="w-full bg-[#2E8B57] text-white px-6 py-4 rounded-xl font-medium shadow-md hover:opacity-90">Send Message</button>
                            {status && <p className="text-center text-sm font-bold mt-4 text-[#2E8B57]">{status}</p>}
                        </form>
                    </div>
                </div>
            );
        };

        const SearchOverlay = ({ publications, onClose, navigateTo, setSelectedItem }) => {
            const [query, setQuery] = useState('');
            const results = query.length > 2 ? publications.filter(p => (p.title + p.summary + p.tags?.join(' ')).toLowerCase().includes(query.toLowerCase())) : [];

            return (
                <div className="fixed inset-0 bg-white/95 dark:bg-charcoal/95 backdrop-blur-xl z-[60] flex flex-col p-6 animate-fade-in overflow-y-auto">
                    <div className="max-w-4xl mx-auto w-full relative">
                        <button onClick={onClose} className="absolute right-0 top-0 p-4 text-gray-500 hover:text-red-500"><Icon name="x" size={32}/></button>
                        <h2 className="text-3xl font-serif font-bold mb-8 dark:text-white pt-12">Search Library</h2>
                        <input autoFocus type="text" placeholder="Type to search..." value={query} onChange={e=>setQuery(e.target.value)} className="w-full text-2xl px-6 py-4 rounded-2xl bg-gray-100 dark:bg-cardDark border-none dark:text-white focus:ring-4 focus:ring-[#2E8B57]/50 mb-8" />
                        <div className="space-y-4">
                            {results.map(item => (
                                <div key={item.id} onClick={() => { setSelectedItem(item); navigateTo(item.type === 'blog' || item.type === 'journal' ? 'reading' : 'detail'); onClose(); }} className="p-4 bg-gray-50 dark:bg-gray-800 rounded-xl cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                                    <h4 className="font-bold dark:text-white">{item.title}</h4>
                                    <p className="text-sm text-gray-500 line-clamp-1">{item.summary}</p>
                                    <span className="text-xs text-[#2E8B57] font-bold uppercase mt-2 block">{item.type}</span>
                                </div>
                            ))}
                            {query.length > 2 && results.length === 0 && <p className="text-gray-500 text-center py-8">No results found for "{query}"</p>}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [darkMode, setDarkMode] = useState(true);
            const [view, setView] = useState('home');
            const [selectedItem, setSelectedItem] = useState(null);
            const [showSearch, setShowSearch] = useState(false);
            const [publications, setPublications] = useState([]);
            const [settings, setSettings] = useState(null);

            useEffect(() => {
                if (darkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [darkMode]);

            useEffect(() => {
                const fetchData = async () => {
                    const { data: pubs } = await supabase.from('publications').select('*').order('id', { ascending: false });
                    if (pubs) setPublications(pubs);
                    const { data: sets } = await supabase.from('site_settings').select('*').eq('id', 1).single();
                    if (sets) setSettings(sets);
                    await supabase.rpc('increment_page_view');
                };
                fetchData();
            }, []);

            const navigateTo = (newView) => {
                setView(newView);
                window.scrollTo(0, 0);
                try { window.history.pushState({}, '', `#${newView}`); } catch (e) {}
            };

            const statBoxes = [
                { count: publications.filter(p=>p.type==='book').length, label: "Books & eBooks", icon: "book" },
                { count: publications.filter(p=>p.type==='research').length, label: "Research Notes", icon: "microscope" },
                { count: publications.filter(p=>p.type==='journal').length, label: "Journal Entries", icon: "layout" },
                { count: publications.filter(p=>p.type==='teaching').length, label: "Teaching Hub", icon: "gradCap" },
                { count: settings?.views_count || 0, label: "Global Readers", icon: "users" },
                { count: settings?.downloads_count || 0, label: "Downloads", icon: "download" },
            ];

            return (
                <div className="min-h-screen flex flex-col selection:bg-emerald selection:text-white relative">
                    <Navbar darkMode={darkMode} setDarkMode={setDarkMode} navigateTo={navigateTo} currentView={view} setShowSearch={setShowSearch} />
                    
                    {showSearch && <SearchOverlay publications={publications} onClose={() => setShowSearch(false)} navigateTo={navigateTo} setSelectedItem={setSelectedItem} />}

                    <main className="flex-grow">
                        {view === 'home' && (
                            <div className="bg-gray-50 dark:bg-[#121212]">
                                <HeroSection settings={settings} navigateTo={navigateTo} />
                                <div className="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 -mt-6 relative z-20 mb-12">
                                    <div className="bg-[#0f1b29] rounded-xl shadow-xl flex flex-wrap lg:flex-nowrap divide-y lg:divide-y-0 lg:divide-x divide-white/10 p-2">
                                        {statBoxes.map((stat, idx) => (
                                            <div key={idx} className="flex-1 min-w-[140px] p-4 flex items-center justify-center lg:justify-start gap-4">
                                                <div className="text-[#D4AF37]"><Icon name={stat.icon} size={28} /></div>
                                                <div>
                                                    <div className="text-white font-bold text-xl leading-none mb-1">{stat.count}</div>
                                                    <div className="text-gray-400 text-xs">{stat.label}</div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <ContentCards publications={publications} navigateTo={navigateTo} setSelectedItem={setSelectedItem} />
                                <div className="py-12"><BottomInfo settings={settings} /></div>
                            </div>
                        )}
                        
                        {['library', 'research', 'teaching', 'projects', 'journal', 'blog'].includes(view) && <GenericListView title={view} type={view} publications={publications} navigateTo={navigateTo} setSelectedItem={setSelectedItem} />}
                        {view === 'detail' && selectedItem && <DetailView item={selectedItem} navigateTo={navigateTo} />}
                        {view === 'reading' && selectedItem && <ReadingView item={selectedItem} navigateTo={navigateTo} />}
                        {view === 'about' && <AboutView settings={settings} navigateTo={navigateTo} />}
                        {view === 'contact' && <ContactView navigateTo={navigateTo} />}
                        
                        {view === 'ai' && <AiAssistantView publications={publications} settings={settings} navigateTo={navigateTo} />}
                    </main>

                    {/* Floating Mobile Ask AI Button */}
                    {view !== 'ai' && (
                        <button onClick={() => navigateTo('ai')} className="md:hidden fixed bottom-6 right-6 w-14 h-14 bg-[#2E8B57] text-white rounded-full shadow-2xl flex items-center justify-center z-50 hover:bg-[#257348] transition-colors">
                            <Icon name="sparkles" size={24} />
                        </button>
                    )}

                    <footer className="bg-[#0B1423] py-8 text-gray-400 text-sm border-t border-white/10">
                        <div className="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-3">
                                 <div className="text-[#D4AF37]"><Icon name="book" size={32} /></div>
                                <div>
                                    <h2 className="text-white font-serif font-bold text-lg leading-none">Ajayi Knowledge Hub</h2>
                                    <span className="text-[#D4AF37] text-[10px] tracking-wider uppercase font-medium">Explore. Learn. Discover. Grow.</span>
                                </div>
                            </div>
                            <div className="text-center">
                                <p>&copy; {new Date().getFullYear()} Paul Olakiitan Ajayi. All rights reserved.</p>
                            </div>
                            <div>{settings?.footer_text || 'Built with ♥ for knowledge, science, and humanity.'}</div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
