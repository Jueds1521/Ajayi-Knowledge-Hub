<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajayi Knowledge Hub</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { navy: '#0B1F3A', 'emerald-custom': '#2E8B57', gold: '#D4AF37' },
                    fontFamily: { serif: ['Merriweather', 'serif'], sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { background-color: #FAFAFA; color: #111827; font-family: 'Inter', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
        .dark body { background-color: #0a0a0a; color: #F9FAFB; }
        
        /* Custom scrollbars from reference */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        .dark ::-webkit-scrollbar-thumb { background-color: #334155; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.8s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const mockLibrary = [
          { id: 'm1', type: 'book', title: 'The Soil Microbiome', date: '2025', category: 'Microbial Genomics', tags: ['Soil', 'Genomics'], summary: 'An exploration of soil microbial networks.', abstract: 'This book covers the comprehensive study of soil microbiomes, focusing on the genetic interactions that drive soil health and agricultural productivity.' },
          { id: 'm2', type: 'book', title: 'Bacillus Insights', date: '2024', category: 'PGPR', tags: ['Bacillus', 'Agriculture'], summary: 'Understanding Bacillus species in crop yield.', abstract: 'A deep dive into how beneficial Bacillus species can be leveraged as Plant Growth-Promoting Rhizobacteria (PGPR) to sustainably improve crop resilience and yield.' }
        ];

        const mockResearch = [
          { id: 'm3', type: 'research', title: 'Molecular ID of PGPR in Maize', date: '2023', category: 'Agriculture', tags: ['Maize', 'PGPR'], summary: 'Isolating and identifying beneficial bacteria.', abstract: 'This study isolates and molecularly identifies specific strains of Plant Growth-Promoting Rhizobacteria associated with the rhizosphere of maize.' }
        ];

        const mockJournal = [
          { id: 'm5', type: 'journal', title: 'My Graduate School Journey', date: 'Oct 12, 2025', category: 'Personal', tags: ['Grad School', 'Life'], summary: 'Lessons learned in the first year of my PhD.', content: 'Starting graduate school has been one of the most challenging yet rewarding experiences of my life. From late nights in the lab running PCRs to presenting at my first major conference, the journey has reshaped how I view scientific inquiry.\n\nResearch is not a straight line; it is a series of iterative loops where failure is just data telling you what not to do next time.' },
          { id: 'm6', type: 'blog', title: 'Why Microbes Matter', date: 'Sep 05, 2025', category: 'Science', tags: ['Microbiology', 'Public Health'], summary: 'How invisible life shapes our visible world.', content: 'Microbes are the unseen engines of our planet. They drive nutrient cycles, digest our food, and even regulate our climate. Yet, for a long time, humanity only viewed them through the lens of disease. Today, the advent of genomics is allowing us to map the microbiome of oceans, soils, and humans. By understanding these tiny organisms, we can revolutionize agriculture, develop novel therapeutics, and perhaps solve some of our most pressing environmental crises.' }
        ];

        const mockTeaching = [
          { id: 'm7', type: 'teaching', title: 'Intro to Bioinformatics', date: '2025', category: 'Tutorial', tags: ['Code', 'Data'], summary: 'Beginner guide to genomic analysis.', abstract: 'A complete module covering the basics of bioinformatics, sequence alignment, and using AI tools to analyze massive biological datasets.' }
        ];

        const mockProjects = [
          { id: 'm9', type: 'project', title: 'AI in Agriculture Initiative', date: 'Ongoing', category: 'Innovation', tags: ['AI', 'Sustainability'], summary: 'Predicting crop yields using microbial data.', abstract: 'A collaborative project utilizing machine learning models to analyze soil microbiome data and predict optimal crop yield conditions.' }
        ];

        const ParticleBackground = ({ isDarkMode }) => {
          const canvasRef = useRef(null);
          useEffect(() => {
            const canvas = canvasRef.current;
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            if (!ctx) return;
            let animationFrameId;
            let particles = [];
            const resize = () => { if (canvas) { canvas.width = window.innerWidth; canvas.height = window.innerHeight; } };
            window.addEventListener('resize', resize);
            resize();
            class Particle {
              constructor() {
                this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.5; this.vy = (Math.random() - 0.5) * 0.5;
                this.radius = Math.random() * 2 + 1;
              }
              update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
                if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;
              }
              draw() {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = isDarkMode ? 'rgba(46, 139, 87, 0.2)' : 'rgba(11, 31, 58, 0.1)'; ctx.fill();
              }
            }
            for (let i = 0; i < 40; i++) particles.push(new Particle());
            const animate = () => {
              if (!ctx || !canvas) return;
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              particles.forEach(p => { p.update(); p.draw(); });
              particles.forEach((p1, i) => {
                particles.slice(i + 1).forEach(p2 => {
                  const dist = Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
                  if (dist < 100) {
                    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
                    ctx.strokeStyle = isDarkMode ? `rgba(46, 139, 87, ${0.15 - dist/600})` : `rgba(11, 31, 58, ${0.1 - dist/1000})`; ctx.stroke();
                  }
                });
              });
              animationFrameId = requestAnimationFrame(animate);
            };
            animate();
            return () => { window.removeEventListener('resize', resize); if (animationFrameId) cancelAnimationFrame(animationFrameId); };
          }, [isDarkMode]);
          return <canvas ref={canvasRef} className="absolute top-0 left-0 w-full h-full pointer-events-none z-0" />;
        };

        const PublicationDetailView = ({ item, setView }) => {
          const [showCitation, setShowCitation] = useState(false);
          const getBackView = () => ['book','research','teaching','project'].includes(item.type) ? (item.type === 'book' ? 'library' : item.type === 'project' ? 'projects' : item.type) : 'home';

          return (
            <div className="max-w-5xl mx-auto px-4 sm:px-6 pt-32 pb-24 relative z-10 min-h-screen animate-fade-in">
              <button onClick={() => setView(getBackView())} className="flex items-center text-emerald-600 dark:text-emerald-400 hover:opacity-80 transition-opacity mb-8 font-medium">
                <i className="fas fa-arrow-left mr-2"></i> Back to Collection
              </button>
              
              <div className="bg-white dark:bg-[#1E1E1E] rounded-3xl p-8 shadow-xl border border-gray-100 dark:border-gray-800 mb-12">
                <div className="flex flex-col md:flex-row gap-10">
                  <div className="w-full md:w-1/3 flex-shrink-0">
                    <div className="aspect-[3/4] bg-gradient-to-br from-navy to-[#1a365d] dark:from-gray-800 dark:to-gray-950 rounded-2xl shadow-lg flex flex-col items-center justify-center p-6 text-center border border-gray-200 dark:border-gray-700 relative overflow-hidden">
                       <i className={`fas ${item.type === 'book' ? 'fa-book' : 'fa-file-alt'} text-6xl text-emerald-custom opacity-20 absolute`}></i>
                       <h3 className="text-white font-serif font-bold text-xl leading-tight z-10">{item.title}</h3>
                       <p className="text-emerald-300 text-sm mt-4 z-10">Paul O. Ajayi</p>
                    </div>
                  </div>
                  <div className="w-full md:w-2/3 flex flex-col justify-center">
                    <div className="flex items-center space-x-3 mb-4">
                      <span className="px-3 py-1 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400 rounded-full text-xs font-bold uppercase tracking-wider">{item.category || 'General'}</span>
                      <span className="text-gray-500 dark:text-gray-400 text-sm font-medium">{item.date || item.published_date || '2026'}</span>
                    </div>
                    <h1 className="text-3xl md:text-5xl font-bold font-serif text-navy dark:text-white mb-6 leading-tight">{item.title}</h1>
                    
                    <div className="flex flex-wrap gap-2 mb-6">
                      {(item.tags || []).map(tag => (
                        <span key={tag} className="text-xs text-gray-500 dark:text-gray-400 bg-gray-100 dark:bg-gray-800 px-2 py-1 rounded-md">#{tag}</span>
                      ))}
                    </div>

                    <h3 className="text-lg font-bold text-navy dark:text-white mb-2">Abstract / Summary</h3>
                    <p className="text-gray-600 dark:text-gray-300 text-lg leading-relaxed mb-8">{item.abstract || item.summary || item.content}</p>
                    
                    <div className="flex flex-wrap gap-4 mt-auto">
                      {item.file_url ? (
                        <a href={item.file_url} target="_blank" rel="noopener noreferrer" className="flex items-center bg-navy hover:bg-[#1a365d] dark:bg-emerald-600 dark:hover:bg-emerald-700 text-white px-6 py-3 rounded-xl font-medium transition-all shadow-md">
                          <i className="fas fa-download mr-2"></i> Download PDF
                        </a>
                      ) : (
                        <button disabled className="flex items-center bg-gray-200 dark:bg-gray-800 text-gray-400 dark:text-gray-600 px-6 py-3 rounded-xl font-medium transition-all shadow-sm cursor-not-allowed">
                          <i className="fas fa-file-pdf mr-2"></i> No PDF Attached
                        </button>
                      )}
                      <button onClick={() => setShowCitation(!showCitation)} className="flex items-center bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-navy dark:text-white px-6 py-3 rounded-xl font-medium transition-all">
                        <i className="fas fa-quote-right mr-2"></i> Cite
                      </button>
                    </div>

                    {showCitation && (
                      <div className="mt-4 p-4 bg-gray-50 dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 animate-fade-in">
                        <p className="text-sm font-serif text-gray-700 dark:text-gray-300">
                          Ajayi, P. O. ({item.date || item.published_date || '2026'}). <i>{item.title}</i>. Ajayi Knowledge Hub.
                        </p>
                        <button className="mt-2 text-xs text-emerald-600 font-medium hover:underline">Copy to clipboard</button>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          );
        };

        const ArticleReadingView = ({ item, setView }) => (
          <div className="max-w-3xl mx-auto px-4 sm:px-6 pt-32 pb-24 relative z-10 min-h-screen animate-fade-in">
            <button onClick={() => setView(item.type === 'blog' ? 'blog' : 'journal')} className="flex items-center text-emerald-600 dark:text-emerald-400 hover:opacity-80 transition-opacity mb-8 font-medium">
              <i className="fas fa-arrow-left mr-2"></i> Back to {item.type === 'blog' ? 'Blog' : 'Journal'}
            </button>
            <article className="max-w-none">
              <div className="text-center mb-12">
                <span className="px-3 py-1 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400 rounded-full text-xs font-bold uppercase tracking-wider inline-block mb-4">{item.category || 'Post'}</span>
                <h1 className="text-4xl md:text-5xl font-bold font-serif text-navy dark:text-white mb-6 leading-tight">{item.title}</h1>
                <div className="flex items-center justify-center space-x-4 text-gray-500 dark:text-gray-400 font-medium text-sm">
                  <span>By Paul O. Ajayi</span>
                  <span>•</span>
                  <span>{item.date || item.published_date || 'Recent'}</span>
                </div>
              </div>
              <div className="text-gray-800 dark:text-gray-200 leading-relaxed font-serif whitespace-pre-wrap text-xl">
                {item.content || item.summary}
              </div>
            </article>

            {item.file_url && (
              <div className="mt-12 p-6 bg-emerald-50 dark:bg-emerald-900/20 rounded-2xl border border-emerald-100 dark:border-emerald-800/50 flex flex-col sm:flex-row items-center justify-between shadow-sm">
                <div className="flex items-center mb-4 sm:mb-0">
                  <div className="w-12 h-12 bg-white dark:bg-gray-800 rounded-full flex items-center justify-center shadow-sm mr-4 text-emerald-600 dark:text-emerald-400">
                    <i className="fas fa-file-pdf text-xl"></i>
                  </div>
                  <div className="text-left">
                    <h4 className="font-bold text-navy dark:text-white">Attached Document</h4>
                    <p className="text-sm text-gray-600 dark:text-gray-400">Download the full PDF for this post</p>
                  </div>
                </div>
                <a href={item.file_url} target="_blank" rel="noopener noreferrer" className="px-6 py-3 w-full sm:w-auto text-center bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-medium transition-all shadow-md flex justify-center items-center">
                  <i className="fas fa-download mr-2"></i> Download PDF
                </a>
              </div>
            )}
          </div>
        );

        const AboutView = () => (
          <div className="max-w-5xl mx-auto px-4 sm:px-6 pt-32 pb-24 relative z-10 min-h-screen animate-fade-in">
            <div className="flex flex-col md:flex-row gap-12 items-start">
              <div className="w-full md:w-1/3 flex-shrink-0 md:sticky md:top-32">
                <div className="aspect-square rounded-3xl bg-gradient-to-br from-navy to-[#1a365d] dark:from-gray-800 dark:to-gray-900 p-1 flex flex-col items-center justify-center text-center shadow-lg border border-gray-100 dark:border-gray-800 relative overflow-hidden">
                  <div className="w-full h-full bg-gray-50 dark:bg-[#111] rounded-[22px] flex items-center justify-center text-navy dark:text-emerald-custom">
                    <i className="fas fa-user-circle text-6xl opacity-50"></i>
                  </div>
                </div>
              </div>
              <div className="w-full md:w-2/3">
                <h1 className="text-4xl md:text-5xl font-bold font-serif text-navy dark:text-white mb-2">Paul Olakiitan Ajayi</h1>
                <p className="text-xl text-emerald-custom font-medium mb-8">Microbiologist · Researcher · Educator · Writer</p>
                <div className="text-gray-700 dark:text-gray-300 leading-relaxed font-serif text-lg space-y-6">
                  <div className="p-6 bg-emerald-50 dark:bg-emerald-900/20 rounded-2xl border border-emerald-100 dark:border-emerald-900/50 mb-8 shadow-sm">
                    <h3 className="text-xl font-bold font-sans text-navy dark:text-white mb-3 flex items-center">
                      <i className="fas fa-check-circle text-emerald-600 mr-2"></i> Mission
                    </h3>
                    <p className="text-gray-800 dark:text-gray-200 font-medium text-base">To advance science through research, education, innovation, and the open sharing of knowledge that improves agriculture, human health, and society.</p>
                  </div>
                  <p>Paul Olakiitan Ajayi is a microbiologist, educator, and aspiring researcher passionate about understanding microorganisms and their role in agriculture, human health, and sustainable development.</p>
                  <p>His academic journey began with a Bachelor of Technology in Microbiology, where his undergraduate research focused on isolating and molecularly identifying plant growth-promoting rhizobacteria (PGPR) associated with maize.</p>
                </div>
              </div>
            </div>
          </div>
        );

        const ContactView = () => (
          <div className="max-w-5xl mx-auto px-4 sm:px-6 pt-32 pb-24 relative z-10 min-h-screen animate-fade-in">
            <div className="text-center mb-16">
              <h2 className="text-4xl font-bold font-serif text-navy dark:text-white mb-4">Let's Connect</h2>
              <p className="text-gray-600 dark:text-gray-400 text-lg max-w-2xl mx-auto">Whether you're interested in research collaboration, speaking engagements, or just want to discuss microbiology, I'd love to hear from you.</p>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-12">
              <div className="bg-white dark:bg-[#1E1E1E] rounded-3xl p-8 shadow-xl border border-gray-100 dark:border-gray-800">
                <h3 className="text-2xl font-bold font-serif text-navy dark:text-white mb-6">Send a Message</h3>
                <form className="space-y-4">
                  <input type="text" placeholder="Your Name" className="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:outline-none focus:ring-2 focus:ring-emerald-custom text-gray-900 dark:text-white" />
                  <input type="email" placeholder="Your Email" className="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:outline-none focus:ring-2 focus:ring-emerald-custom text-gray-900 dark:text-white" />
                  <textarea rows="5" placeholder="Your Message" className="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:outline-none focus:ring-2 focus:ring-emerald-custom text-gray-900 dark:text-white resize-none"></textarea>
                  <button type="button" className="w-full bg-navy dark:bg-emerald-600 hover:bg-[#1a365d] dark:hover:bg-emerald-700 text-white px-6 py-4 rounded-xl font-medium transition-all shadow-md flex justify-center items-center">
                    <i className="fas fa-paper-plane mr-2"></i> Send Message
                  </button>
                </form>
              </div>
            </div>
          </div>
        );

        const AiAssistantView = () => (
          <div className="max-w-4xl mx-auto px-4 sm:px-6 pt-32 pb-24 relative z-10 min-h-screen animate-fade-in flex flex-col">
            <div className="text-center mb-8">
              <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-400 to-emerald-600 text-white shadow-lg mb-4">
                <i className="fas fa-magic text-2xl"></i>
              </div>
              <h2 className="text-3xl font-bold font-serif text-navy dark:text-white mb-2">AI Knowledge Assistant</h2>
              <p className="text-gray-600 dark:text-gray-400">Search and summarize Paul's published research, books, and articles.</p>
            </div>
            <div className="flex-1 bg-white dark:bg-[#1E1E1E] rounded-3xl shadow-xl border border-gray-100 dark:border-gray-800 flex flex-col overflow-hidden min-h-[500px]">
              <div className="p-6 overflow-y-auto flex-1 space-y-6">
                <div className="flex items-start">
                  <div className="w-10 h-10 rounded-full bg-emerald-100 dark:bg-emerald-900/50 flex items-center justify-center flex-shrink-0 mr-4">
                    <i className="fas fa-robot text-emerald-600 dark:text-emerald-400"></i>
                  </div>
                  <div className="bg-gray-50 dark:bg-gray-800 rounded-2xl rounded-tl-none p-4 text-gray-800 dark:text-gray-200 shadow-sm border border-gray-100 dark:border-gray-700 max-w-[80%]">
                    <p>Hello! I'm trained on Paul Olakiitan Ajayi's knowledge base. You can ask me to summarize his research, find articles on specific topics like PGPR, or explain microbiology concepts. How can I help you today?</p>
                  </div>
                </div>
              </div>
              <div className="p-4 bg-gray-50 dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700">
                <div className="relative">
                  <input type="text" placeholder="Ask a question..." className="w-full pl-6 pr-14 py-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 focus:outline-none focus:ring-2 focus:ring-emerald-custom text-gray-900 dark:text-white" />
                  <button className="absolute right-3 top-1/2 transform -translate-y-1/2 p-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg transition-colors">
                    <i className="fas fa-paper-plane"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        );

        const HomeView = ({ setView, setSelectedItem, latestBook, latestResearch, latestJournal, latestBlog, latestProject }) => {
          
          const handleReadMore = (item) => {
            if (!item) return;
            setSelectedItem(item);
            setView(['journal', 'blog'].includes(item.type) ? 'reading' : 'detail');
          };

          return (
            <div className="relative z-10 pb-10">
              {/* Hero Section with Reference Design */}
              <section className="relative pt-32 pb-24 flex items-center justify-center bg-navy text-white overflow-hidden min-h-[80vh]">
                  {/* Background Overlays */}
                  <div className="absolute inset-0 z-0 bg-[url('https://images.unsplash.com/photo-1532094349884-543bc11b234d?auto=format&fit=crop&q=80')] bg-cover bg-center opacity-20 mix-blend-overlay"></div>
                  <div className="absolute inset-0 z-0 bg-gradient-to-b from-navy/80 via-navy/60 to-navy"></div>
                  <ParticleBackground isDarkMode={true} />
                  
                  <div className="relative z-10 container mx-auto px-6 text-center max-w-5xl animate-slide-up">
                      <h1 className="font-serif text-5xl md:text-7xl font-bold mb-6 leading-tight tracking-tight">
                          Knowledge that <span className="text-emerald-custom">grows</span>.<br />
                          Research that <span className="text-gold">matters</span>.<br />
                          Ideas that <span className="text-[#8B9C2A]">inspire</span>.
                      </h1>
                      
                      <h2 className="text-xl md:text-2xl text-gold font-medium mb-6 font-serif">
                          Welcome to my digital knowledge hub.
                      </h2>
                      
                      <p className="text-base md:text-lg text-gray-300 mb-12 max-w-3xl mx-auto font-light leading-relaxed">
                          Here I share my books, scientific research, teaching materials, journals, articles, and ideas as I pursue a lifelong mission of learning, discovery, and service.
                      </p>
                      
                      <div className="flex flex-wrap items-center justify-center gap-4">
                          <button onClick={() => setView('library')} className="px-8 py-3.5 bg-emerald-custom hover:bg-[#257348] text-white text-sm font-semibold rounded-lg transition-all flex items-center justify-center gap-2 border border-emerald-custom">
                              <i className="fas fa-book text-lg"></i> Explore Library
                          </button>
                          <button onClick={() => setView('research')} className="px-8 py-3.5 bg-transparent hover:bg-white/5 text-white text-sm font-semibold rounded-lg transition-all border border-blue-400/30 flex items-center justify-center gap-2">
                              <i className="fas fa-microscope text-lg"></i> Research Archive
                          </button>
                          <button onClick={() => setView('teaching')} className="px-8 py-3.5 bg-[#3B7A57]/80 hover:bg-[#3B7A57] text-white text-sm font-semibold rounded-lg transition-all border border-[#3B7A57] flex items-center justify-center gap-2">
                              <i className="fas fa-graduation-cap text-lg"></i> Teaching Hub
                          </button>
                          <button onClick={() => setView('about')} className="px-8 py-3.5 bg-transparent hover:bg-white/5 text-white text-sm font-semibold rounded-lg transition-all border border-white/20 flex items-center justify-center gap-2">
                              <i className="fas fa-users text-lg"></i> About Me
                          </button>
                      </div>
                  </div>
              </section>

              {/* Floating Stats Banner */}

                  {/* Universal Dropdown Menu */}
                  {mobileMenuOpen && (
                      <div className="absolute top-20 right-4 sm:right-8 w-[calc(100%-2rem)] sm:w-72 bg-navy border border-white/10 shadow-2xl rounded-2xl py-3 px-3 flex flex-col space-y-1 animate-fade-in z-50">
                          <div className="mb-2 px-3 py-2 border-b border-white/10">
                              <p className="text-xs font-bold text-gray-400 uppercase tracking-wider">Navigation</p>
                          </div>
                          {navItems.map((item) => (
                              <button 
                                  key={item.name} 
                                  onClick={() => { setCurrentView(item.view); setMobileMenuOpen(false); }} 
                                  className={`w-full flex items-center px-4 py-3 rounded-xl text-sm font-medium transition-colors ${currentView === item.view ? 'text-white bg-emerald-custom' : 'text-gray-300 hover:bg-white/10 hover:text-white'}`}
                              >
                                  <i className={`fas ${item.icon} w-6 mr-2 opacity-70`}></i> {item.name}
                              </button>
                          ))}
                          
                          <div className="mt-2 pt-2 border-t border-white/10">
                              <button onClick={() => { window.location.href = '/admin.html'; }} className="w-full flex items-center px-4 py-3 rounded-xl text-sm font-bold text-gold hover:bg-white/10 transition-colors">
                                  <i className="fas fa-lock w-6 mr-2 opacity-70"></i> Admin Portal
                              </button>
                          </div>
                          
                          {/* Mobile Only Quick Actions */}
                          <div className="mt-2 pt-2 border-t border-white/10 flex space-x-2 block sm:hidden">
                              <button onClick={() => { setCurrentView('ai'); setMobileMenuOpen(false); }} className="flex-1 flex justify-center items-center text-sm font-bold text-white bg-emerald-custom hover:bg-[#257348] py-2.5 rounded-lg transition-colors">
                                  <i className="fas fa-magic mr-2"></i> Ask AI
                              </button>
                              <button className="flex-1 flex justify-center items-center text-sm font-bold text-gray-300 bg-white/5 hover:bg-white/10 py-2.5 rounded-lg transition-colors">
                                  <i className="fas fa-search"></i>
                              </button>
                          </div>
                      </div>
                  )}
              </nav>

              <main className="flex-grow">
                {currentView === 'home' && (
                  <HomeView 
                    setView={setCurrentView} 
                    setSelectedItem={setSelectedItem}
                    latestBook={latestBook}
                    latestResearch={latestResearch}
                    latestJournal={latestJournal}
                    latestBlog={latestBlog}
                    latestProject={latestProject}
                  />
                )}
                {currentView === 'detail' && selectedItem && <PublicationDetailView item={selectedItem} setView={setCurrentView} />}
                {currentView === 'reading' && selectedItem && <ArticleReadingView item={selectedItem} setView={setCurrentView} />}
                {currentView === 'about' && <AboutView />}
                {currentView === 'contact' && <ContactView />}
                {currentView === 'ai' && <AiAssistantView />}
                
                {currentView === 'library' && renderGenericList('Digital Library', combinedLibrary)}
                {currentView === 'research' && renderGenericList('Research Archive', combinedResearch)}
                {currentView === 'teaching' && renderGenericList('Teaching Hub', mockTeaching)}
                {currentView === 'projects' && renderGenericList('Projects & Initiatives', mockProjects)}
                {currentView === 'journal' && renderGenericList('Personal Journal', combinedJournal)}
                {currentView === 'blog' && renderGenericList('Professional Blog', combinedBlog)}
              </main>
              
              {/* Footer updated to match reference */}
              <footer className="bg-navy py-8 text-gray-400 text-sm border-t border-white/10 mt-auto">
                  <div className="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4">
                      <div className="flex items-center gap-3">
                          <div className="text-gold">
                              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                                  <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
                                  <path d="M8 7h6"/><path d="M8 11h8"/>
                              </svg>
                          </div>
                          <div>
                              <h2 className="text-white font-serif font-bold text-lg leading-none">Ajayi Knowledge Hub</h2>
                              <span className="text-gold text-[10px] tracking-wider uppercase font-medium">Explore. Learn. Discover. Grow.</span>
                          </div>
                      </div>
                      
                      <div className="text-center">
                          <p>&copy; {new Date().getFullYear()} Paul Olakiitan Ajayi. All rights reserved.</p>
                          <div className="flex gap-4 justify-center mt-2 text-xs">
                              <a href="#" className="hover:text-white">Privacy Policy</a>
                              <a href="#" className="hover:text-white">Terms of Use</a>
                              <a href="#" className="hover:text-white">Sitemap</a>
                          </div>
                      </div>
                      
                      <div>
                          Built with <span className="text-emerald-custom">♥</span> for knowledge, science, and humanity.
                      </div>
                  </div>
              </footer>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AjayiKnowledgeHub />);
    </script>
</body>
</html>
