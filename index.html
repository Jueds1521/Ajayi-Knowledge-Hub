<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajayi Knowledge Hub</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configure Tailwind Colors and Fonts -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: '#0B1F3A',
                        'emerald-custom': '#2E8B57',
                        gold: '#D4AF37',
                    },
                    fontFamily: {
                        serif: ['Merriweather', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Load FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Load React, ReactDOM, Babel, and SUPABASE -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- SUPABASE CLIENT -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            background-color: #FAFAFA;
            color: #111827;
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .dark body {
            background-color: #0a0a0a;
            color: #F9FAFB;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Basic animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.8s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const mockLibrary = [
          { id: 'm1', type: 'book', title: 'The Soil Microbiome', date: '2025', category: 'Microbial Genomics', tags: ['Soil', 'Genomics'], summary: 'An exploration of soil microbial networks.', abstract: 'This book covers the comprehensive study of soil microbiomes, focusing on the genetic interactions that drive soil health and agricultural productivity.' },
          { id: 'm2', type: 'book', title: 'Bacillus Insights', date: '2024', category: 'PGPR', tags: ['Bacillus', 'Agriculture'], summary: 'Understanding Bacillus species in crop yield.', abstract: 'A deep dive into how beneficial Bacillus species can be leveraged as Plant Growth-Promoting Rhizobacteria (PGPR) to sustainably improve crop resilience and yield.' }
        ];

        const mockResearch = [
          { id: 'm3', type: 'research', title: 'Molecular ID of PGPR in Maize', date: '2023', category: 'Agriculture', tags: ['Maize', 'PGPR'], summary: 'Isolating and identifying beneficial bacteria.', abstract: 'This study isolates and molecularly identifies specific strains of Plant Growth-Promoting Rhizobacteria associated with the rhizosphere of maize.' }
        ];

        const mockJournal = [
          { id: 'm4', type: 'journal', title: 'My Graduate School Journey', date: 'Oct 12, 2025', category: 'Personal', tags: ['Grad School'], summary: 'Lessons learned in the first year of my PhD.', content: 'Research is not a straight line; it is a series of iterative loops where failure is just data telling you what not to do next time.' },
          { id: 'm5', type: 'blog', title: 'Why Microbes Matter', date: 'Sep 05, 2025', category: 'Science', tags: ['Microbiology'], summary: 'How invisible life shapes our visible world.', content: 'Microbes are the unseen engines of our planet.' }
        ];

        const mockTeaching = [
          { id: 'm6', type: 'teaching', title: 'Intro to Bioinformatics', date: '2025', category: 'Tutorial', tags: ['Code', 'Data'], summary: 'Beginner guide to genomic analysis.', abstract: 'A complete module covering the basics of bioinformatics.' }
        ];

        const mockProjects = [
          { id: 'm7', type: 'project', title: 'AI in Agriculture Initiative', date: 'Ongoing', category: 'Innovation', tags: ['AI', 'Sustainability'], summary: 'Predicting crop yields using microbial data.', abstract: 'A collaborative project utilizing machine learning models to analyze soil microbiome data.' }
        ];

        const ParticleBackground = ({ isDarkMode }) => {
          const canvasRef = useRef(null);
          useEffect(() => {
            const canvas = canvasRef.current;
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            if (!ctx) return;
            let animationFrameId;
            let particles = [];
            const resize = () => { if (canvas) { canvas.width = window.innerWidth; canvas.height = window.innerHeight; } };
            window.addEventListener('resize', resize);
            resize();
            class Particle {
              constructor() {
                this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.5; this.vy = (Math.random() - 0.5) * 0.5;
                this.radius = Math.random() * 2 + 1;
              }
              update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
                if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;
              }
              draw() {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = isDarkMode ? 'rgba(46, 139, 87, 0.2)' : 'rgba(11, 31, 58, 0.1)'; ctx.fill();
              }
            }
            for (let i = 0; i < 40; i++) particles.push(new Particle());
            const animate = () => {
              if (!ctx || !canvas) return;
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              particles.forEach(p => { p.update(); p.draw(); });
              particles.forEach((p1, i) => {
                particles.slice(i + 1).forEach(p2 => {
                  const dist = Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
                  if (dist < 100) {
                    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
                    ctx.strokeStyle = isDarkMode ? `rgba(46, 139, 87, ${0.15 - dist/600})` : `rgba(11, 31, 58, ${0.1 - dist/1000})`; ctx.stroke();
                  }
                });
              });
              animationFrameId = requestAnimationFrame(animate);
            };
            animate();
            return () => { window.removeEventListener('resize', resize); if (animationFrameId) cancelAnimationFrame(animationFrameId); };
          }, [isDarkMode]);
          return <canvas ref={canvasRef} className="fixed top-0 left-0 w-full h-full pointer-events-none z-0" />;
        };

        const PublicationDetailView = ({ item, setView }) => {
          const [showCitation, setShowCitation] = useState(false);
          const getBackView = () => ['book','research','teaching','project'].includes(item.type) ? (item.type === 'book' ? 'library' : item.type) : 'home';

          return (
            <div className="max-w-5xl mx-auto px-4 sm:px-6 pt-32 pb-24 relative z-10 min-h-screen animate-fade-in">
              <button onClick={() => setView(getBackView())} className="flex items-center text-emerald-600 dark:text-emerald-400 hover:opacity-80 transition-opacity mb-8 font-medium">
                <i className="fas fa-arrow-left mr-2"></i> Back to Collection
              </button>
              
              <div className="bg-white dark:bg-gray-900 rounded-3xl p-8 shadow-xl border border-gray-100 dark:border-gray-800 mb-12">
                <div className="flex flex-col md:flex-row gap-10">
                  <div className="w-full md:w-1/3 flex-shrink-0">
                    <div className="aspect-[3/4] bg-gradient-to-br from-navy to-[#1a365d] dark:from-gray-800 dark:to-gray-950 rounded-2xl shadow-lg flex flex-col items-center justify-center p-6 text-center border border-gray-200 dark:border-gray-700 relative overflow-hidden">
                       <i className={`fas ${item.type === 'book' ? 'fa-book' : 'fa-file-alt'} text-6xl text-emerald-custom opacity-20 absolute`}></i>
                       <h3 className="text-white font-serif font-bold text-xl leading-tight z-10">{item.title}</h3>
                       <p className="text-emerald-300 text-sm mt-4 z-10">Paul O. Ajayi</p>
                    </div>
                  </div>
                  <div className="w-full md:w-2/3 flex flex-col justify-center">
                    <div className="flex items-center space-x-3 mb-4">
                      <span className="px-3 py-1 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400 rounded-full text-xs font-bold uppercase tracking-wider">{item.category || 'General'}</span>
                      <span className="text-gray-500 dark:text-gray-400 text-sm font-medium">{item.date || item.published_date || '2026'}</span>
                    </div>
                    <h1 className="text-3xl md:text-5xl font-bold font-serif text-navy dark:text-white mb-6 leading-tight">{item.title}</h1>
                    
                    <div className="flex flex-wrap gap-2 mb-6">
                      {(item.tags || []).map(tag => (
                        <span key={tag} className="text-xs text-gray-500 dark:text-gray-400 bg-gray-100 dark:bg-gray-800 px-2 py-1 rounded-md">#{tag}</span>
                      ))}
                    </div>

                    <h3 className="text-lg font-bold text-navy dark:text-white mb-2">Abstract / Summary</h3>
                    <p className="text-gray-600 dark:text-gray-300 text-lg leading-relaxed mb-8">{item.abstract || item.summary || item.content}</p>
                    
                    <div className="flex flex-wrap gap-4 mt-auto">
                      <button className="flex items-center bg-navy hover:bg-[#1a365d] dark:bg-emerald-600 dark:hover:bg-emerald-700 text-white px-6 py-3 rounded-xl font-medium transition-all shadow-md">
                        <i className="fas fa-download mr-2"></i> Download PDF
                      </button>
                      <button onClick={() => setShowCitation(!showCitation)} className="flex items-center bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-navy dark:text-white px-6 py-3 rounded-xl font-medium transition-all">
                        <i className="fas fa-quote-right mr-2"></i> Cite
                      </button>
                    </div>

                    {showCitation && (
                      <div className="mt-4 p-4 bg-gray-50 dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 animate-fade-in">
                        <p className="text-sm font-serif text-gray-700 dark:text-gray-300">
                          Ajayi, P. O. ({item.date || item.published_date || '2026'}). <i>{item.title}</i>. Ajayi Knowledge Hub.
                        </p>
                        <button className="mt-2 text-xs text-emerald-600 font-medium hover:underline">Copy to clipboard</button>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          );
        };

        const ArticleReadingView = ({ item, setView }) => (
          <div className="max-w-3xl mx-auto px-4 sm:px-6 pt-32 pb-24 relative z-10 min-h-screen animate-fade-in">
            <button onClick={() => setView(item.type === 'blog' ? 'blog' : 'journal')} className="flex items-center text-emerald-600 dark:text-emerald-400 hover:opacity-80 transition-opacity mb-8 font-medium">
              <i className="fas fa-arrow-left mr-2"></i> Back to {item.type === 'blog' ? 'Blog' : 'Journal'}
            </button>
            <article className="max-w-none">
              <div className="text-center mb-12">
                <span className="px-3 py-1 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400 rounded-full text-xs font-bold uppercase tracking-wider inline-block mb-4">{item.category || 'Post'}</span>
                <h1 className="text-4xl md:text-5xl font-bold font-serif text-navy dark:text-white mb-6 leading-tight">{item.title}</h1>
                <div className="flex items-center justify-center space-x-4 text-gray-500 dark:text-gray-400 font-medium text-sm">
                  <span>By Paul O. Ajayi</span>
                  <span>•</span>
                  <span>{item.date || item.published_date || 'Recent'}</span>
                  <span>•</span>
                  <span>4 min read</span>
                </div>
              </div>
              <div className="text-gray-800 dark:text-gray-200 leading-relaxed font-serif whitespace-pre-wrap text-xl">
                {item.content || item.summary}
              </div>
            </article>
          </div>
        );

        const AboutView = () => (
          <div className="max-w-5xl mx-auto px-4 sm:px-6 pt-32 pb-24 relative z-10 min-h-screen animate-fade-in">
            <div className="flex flex-col md:flex-row gap-12 items-start">
              <div className="w-full md:w-1/3 flex-shrink-0 md:sticky md:top-32">
                <div className="aspect-square rounded-3xl bg-gradient-to-br from-navy to-[#1a365d] dark:from-gray-800 dark:to-gray-900 p-1 flex flex-col items-center justify-center text-center shadow-lg border border-gray-100 dark:border-gray-800 relative overflow-hidden">
                  <div className="w-full h-full bg-gray-50 dark:bg-[#111] rounded-[22px] flex items-center justify-center text-navy dark:text-emerald-custom">
                    <i className="fas fa-user text-6xl opacity-50"></i>
                  </div>
                </div>
              </div>
              <div className="w-full md:w-2/3">
                <h1 className="text-4xl md:text-5xl font-bold font-serif text-navy dark:text-white mb-2">Paul Olakiitan Ajayi</h1>
                <p className="text-xl text-emerald-custom font-medium mb-8">Microbiologist · Researcher · Educator · Writer</p>
                <div className="text-gray-700 dark:text-gray-300 leading-relaxed font-serif text-lg space-y-6">
                  <p>Paul Olakiitan Ajayi is a microbiologist, educator, and aspiring researcher passionate about understanding microorganisms and their role in agriculture, human health, and sustainable development.</p>
                  <p>Beyond research, Paul is deeply committed to teaching, mentoring students, scientific communication, and lifelong learning.</p>
                </div>
              </div>
            </div>
          </div>
        );

        const AjayiKnowledgeHub = () => {
          const [isDarkMode, setIsDarkMode] = useState(true);
          const [currentView, setCurrentView] = useState('home');
          const [selectedItem, setSelectedItem] = useState(null);
          
          // SUPABASE DATABASE STATE
          const [dbPublications, setDbPublications] = useState([]);

          useEffect(() => {
            if (isDarkMode) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
          }, [isDarkMode]);

          // THE MAGIC CONNECTION TO YOUR BACKEND
          useEffect(() => {
            const fetchSupabaseData = async () => {
              // Using your provided keys to securely connect to your database!
              const supabaseUrl = 'https://ulqihwnzujncqpexersp.supabase.co';
              const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVscWlod256dWpuY3FwZXhlcnNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNDIxNjMsImV4cCI6MjEwMDgxODE2M30.vvMQLeUtjVmciJxwqVgiFVZjmHlclY0Z-oHngY3SVso';
              
              // We check if the Supabase script loaded successfully
              if (window.supabase) {
                const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
                try {
                  const { data, error } = await supabase.from('publications').select('*');
                  if (error) {
                    console.error('Error fetching from Supabase:', error);
                  } else if (data) {
                    console.log("Successfully connected and fetched data from Supabase!", data);
                    setDbPublications(data);
                  }
                } catch (error) {
                  console.error('Supabase connection failed:', error);
                }
              }
            };
            
            fetchSupabaseData();
          }, []);

          // MERGING YOUR LIVE DATABASE WITH THE MOCK DATA
          const combinedLibrary = [...dbPublications.filter(p => p.type === 'book'), ...mockLibrary];
          const combinedResearch = [...dbPublications.filter(p => p.type === 'research'), ...mockResearch];
          const combinedJournal = [...dbPublications.filter(p => p.type === 'journal'), ...mockJournal.filter(j => j.type === 'journal')];
          const combinedBlog = [...dbPublications.filter(p => p.type === 'blog'), ...mockJournal.filter(j => j.type === 'blog')];

          const navItems = [
            { name: 'Library', view: 'library' },
            { name: 'Research', view: 'research' },
            { name: 'Teaching', view: 'teaching' },
            { name: 'Blog', view: 'blog' },
            { name: 'About', view: 'about' }
          ];

          const renderGenericList = (title, data) => (
            <div className="pt-32 pb-24 max-w-7xl mx-auto px-4 sm:px-6 relative z-10 min-h-screen animate-fade-in">
              <h1 className="text-4xl font-bold font-serif text-navy dark:text-white capitalize mb-4">{title}</h1>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mt-12">
                {data.map(item => (
                  <div key={item.id} className="bg-white dark:bg-gray-900 rounded-2xl p-6 shadow-sm hover:shadow-md transition-shadow border border-gray-100 dark:border-gray-800 flex flex-col h-full">
                    <span className="text-xs font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400 mb-2">{item.category || 'Content'}</span>
                    <h3 className="text-xl font-bold text-navy dark:text-white mb-3">{item.title}</h3>
                    <p className="text-sm text-gray-600 dark:text-gray-400 mb-6 flex-grow">{item.summary}</p>
                    <button onClick={() => { 
                      setSelectedItem(item); 
                      setCurrentView((item.type === 'journal' || item.type === 'blog') ? 'reading' : 'detail'); 
                    }} className="text-emerald-custom text-sm font-semibold flex items-center hover:gap-1 transition-all mt-auto">
                      Read More <i className="fas fa-chevron-right ml-1"></i>
                    </button>
                  </div>
                ))}
              </div>
            </div>
          );

          return (
            <div className="min-h-screen flex flex-col overflow-x-hidden">
              <ParticleBackground isDarkMode={isDarkMode} />
              
              <header className="fixed top-0 w-full z-50 bg-white/80 dark:bg-[#0a0a0a]/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 transition-all duration-300">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
                  <div className="flex items-center space-x-2 cursor-pointer group" onClick={() => setCurrentView('home')}>
                    <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-navy to-emerald-custom flex items-center justify-center shadow-md">
                      <span className="text-white font-serif font-bold text-xl">A</span>
                    </div>
                    <span className="font-serif font-bold text-xl text-navy dark:text-white hidden lg:block">Ajayi Hub</span>
                  </div>
                  
                  <nav className="hidden md:flex items-center space-x-1 lg:space-x-2">
                    {navItems.map((item) => (
                      <button key={item.name} onClick={() => setCurrentView(item.view)} className={`px-3 py-2 rounded-lg text-sm font-medium transition-colors ${currentView === item.view ? 'text-emerald-custom bg-emerald-50 dark:bg-emerald-900/20' : 'text-gray-600 dark:text-gray-300 hover:text-navy dark:hover:text-white'}`}>
                        {item.name}
                      </button>
                    ))}
                  </nav>
                  
                  <div className="flex items-center space-x-2 sm:space-x-4">
                    <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 rounded-full text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                      <i className={`fas ${isDarkMode ? 'fa-sun' : 'fa-moon'} text-xl`}></i>
                    </button>
                  </div>
                </div>
              </header>

              <main className="flex-1">
                {currentView === 'home' && (
                  <div className="relative pt-32 pb-20 md:pt-48 md:pb-32 px-4 sm:px-6 max-w-7xl mx-auto flex flex-col items-center justify-center text-center z-10 min-h-[85vh]">
                    <div className="animate-slide-up">
                      <div className="inline-flex items-center px-4 py-2 rounded-full bg-emerald-50 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400 font-medium text-sm mb-8 border border-emerald-100 dark:border-emerald-800 shadow-sm">
                        <span className="w-2 h-2 rounded-full bg-emerald-500 mr-2 animate-pulse"></span>
                        Microbiologist & Researcher
                      </div>
                      <h1 className="text-5xl md:text-7xl font-bold font-serif text-navy dark:text-white mb-6 leading-tight max-w-4xl mx-auto drop-shadow-sm">
                        Knowledge that grows. <br className="hidden md:block"/>
                        <span className="text-emerald-custom relative">
                          Research that matters.
                          <svg className="absolute w-full h-3 -bottom-1 left-0 text-emerald-300 dark:text-emerald-800 opacity-50" viewBox="0 0 100 10" preserveAspectRatio="none"><path d="M0 5 Q 50 10 100 5" stroke="currentColor" strokeWidth="2" fill="transparent"/></svg>
                        </span>
                      </h1>
                      <div className="mt-8">
                        <button onClick={() => setCurrentView('library')} className="bg-navy hover:bg-[#1a365d] dark:bg-emerald-600 dark:hover:bg-emerald-700 text-white px-8 py-4 rounded-xl font-medium transition-all shadow-lg hover:shadow-xl transform hover:-translate-y-1">
                          Explore Library
                        </button>
                      </div>
                    </div>
                  </div>
                )}
                {currentView === 'detail' && selectedItem && <PublicationDetailView item={selectedItem} setView={setCurrentView} />}
                {currentView === 'reading' && selectedItem && <ArticleReadingView item={selectedItem} setView={setCurrentView} />}
                {currentView === 'about' && <AboutView />}
                
                {/* Notice how these now use the 'combined' data variables! */}
                {currentView === 'library' && renderGenericList('Digital Library', combinedLibrary)}
                {currentView === 'research' && renderGenericList('Research Archive', combinedResearch)}
                {currentView === 'teaching' && renderGenericList('Teaching Hub', mockTeaching)}
                {currentView === 'blog' && renderGenericList('Professional Blog', combinedBlog)}
              </main>
              
              <footer className="relative z-10 border-t border-gray-200 dark:border-gray-800 bg-white dark:bg-[#0a0a0a] pt-16 pb-8 mt-auto">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 text-center text-gray-500 dark:text-gray-400 text-sm">
                  <p>© 2026 Paul Olakiitan Ajayi. All rights reserved.</p>
                </div>
              </footer>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AjayiKnowledgeHub />);
    </script>
</body>
</html>
