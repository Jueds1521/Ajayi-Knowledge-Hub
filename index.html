        const ParticleBackground = ({ isDarkMode }) => {
          const canvasRef = useRef(null);
          useEffect(() => {
            const canvas = canvasRef.current;
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            if (!ctx) return;
            let animationFrameId;
            let particles = [];
            const resize = () => { if (canvas) { canvas.width = window.innerWidth; canvas.height = window.innerHeight; } };
            window.addEventListener('resize', resize);
            resize();
            class Particle {
              constructor() {
                this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.5; this.vy = (Math.random() - 0.5) * 0.5;
                this.radius = Math.random() * 2 + 1;
              }
              update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
                if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;
              }
              draw() {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = isDarkMode ? 'rgba(46, 139, 87, 0.2)' : 'rgba(11, 31, 58, 0.1)'; ctx.fill();
              }
            }
            for (let i = 0; i < 40; i++) particles.push(new Particle());
            const animate = () => {
              if (!ctx || !canvas) return;
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              particles.forEach(p => { p.update(); p.draw(); });
              particles.forEach((p1, i) => {
                particles.slice(i + 1).forEach(p2 => {
                  const dist = Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
                  if (dist < 100) {
                    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
                    ctx.strokeStyle = isDarkMode ? `rgba(46, 139, 87, ${0.15 - dist/600})` : `rgba(11, 31, 58, ${0.1 - dist/1000})`; ctx.stroke();
                  }
                });
              });
              animationFrameId = requestAnimationFrame(animate);
            };
            animate();
            return () => { window.removeEventListener('resize', resize); if (animationFrameId) cancelAnimationFrame(animationFrameId); };
          }, [isDarkMode]);
          return <canvas ref={canvasRef} className="fixed top-0 left-0 w-full h-full pointer-events-none z-0" />;
        };

          const combinedBlog = [...dbPublications.filter(p => p.type === 'blog'), ...mockJournal.filter(j => j.type === 'blog')];

          const navItems = [
            { name: 'Library', view: 'library' },
            { name: 'Research', view: 'research' },
            { name: 'Teaching', view: 'teaching' },
            { name: 'Journal', view: 'journal' },
            { name: 'Blog', view: 'blog' },
            { name: 'Projects', view: 'projects' },
            { name: 'About', view: 'about' },
            { name: 'Contact', view: 'contact' }
          ];

          const renderGenericList = (title, data) => (
            <div className="pt-32 pb-24 max-w-7xl mx-auto px-4 sm:px-6 relative z-10 min-h-screen animate-fade-in">
              <h1 className="text-4xl font-bold font-serif text-navy dark:text-white capitalize mb-4">{title}</h1>
              <p className="text-gray-500 dark:text-gray-400 mb-12 max-w-2xl">Explore the archive of {title.toLowerCase()} published by Paul Olakiitan Ajayi.</p>
              
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mt-12">
                {data.map(item => (
                  <div key={item.id} className="bg-white dark:bg-gray-900 rounded-2xl p-6 shadow-sm hover:shadow-md transition-shadow border border-gray-100 dark:border-gray-800 flex flex-col h-full">
                    <span className="text-xs font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400 mb-2">{item.category || 'Content'}</span>
                    <h3 className="text-xl font-bold text-navy dark:text-white mb-3">{item.title}</h3>
                    <p className="text-sm text-gray-600 dark:text-gray-400 mb-6 flex-grow">{item.summary || item.content?.substring(0, 100) + '...'}</p>
                    <button onClick={() => { 
                      setSelectedItem(item); 
                      setCurrentView((item.type === 'journal' || item.type === 'blog') ? 'reading' : 'detail'); 
                    }} className="text-emerald-custom text-sm font-semibold flex items-center hover:gap-1 transition-all mt-auto">
                      Read More <i className="fas fa-chevron-right ml-1"></i>
                    </button>
                  </div>
                ))}
              </div>
            </div>
          );

          return (
            <div className={`min-h-screen flex flex-col overflow-x-hidden bg-[#FAFAFA] dark:bg-[#0a0a0a] text-gray-900 dark:text-gray-100 font-sans transition-colors duration-300 ${isDarkMode ? 'dark' : ''}`}>
              <ParticleBackground isDarkMode={isDarkMode} />
              
              <header className="fixed top-0 w-full z-50 bg-white/80 dark:bg-[#0a0a0a]/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 transition-all duration-300">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
                  <div className="flex items-center space-x-2 cursor-pointer group" onClick={() => setCurrentView('home')}>
                    <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-navy to-emerald-custom flex items-center justify-center shadow-md">
                      <span className="text-white font-serif font-bold text-xl">A</span>
                    </div>
                    <span className="font-serif font-bold text-xl text-navy dark:text-white hidden lg:block">Ajayi Hub</span>
                  </div>
                  
                  <nav className="hidden md:flex items-center space-x-1 lg:space-x-2">
                    {navItems.map((item) => (
                      <button key={item.name} onClick={() => setCurrentView(item.view)} className={`px-3 py-2 rounded-lg text-sm font-medium transition-colors ${currentView === item.view ? 'text-emerald-custom bg-emerald-50 dark:bg-emerald-900/20' : 'text-gray-600 dark:text-gray-300 hover:text-navy dark:hover:text-white'}`}>
                        {item.name}
                      </button>
                    ))}
                  </nav>
                  
                  <div className="flex items-center space-x-2 sm:space-x-4">
                    <button onClick={() => setCurrentView('ai')} className="hidden sm:flex items-center text-sm font-medium text-emerald-custom border border-emerald-200 dark:border-emerald-800 px-3 py-1.5 rounded-lg hover:bg-emerald-50 dark:hover:bg-emerald-900/30 transition-colors">
                      <i className="fas fa-magic mr-1.5"></i> Ask AI
                    </button>
                    <button className="p-2 rounded-full text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors hidden sm:block" title="Global Search">
                      <i className="fas fa-search text-lg"></i>
                    </button>
                    <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 rounded-full text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                      <i className={`fas ${isDarkMode ? 'fa-sun' : 'fa-moon'} text-lg`}></i>
                    </button>
                    
                    {/* THIS NOW LINKS TO THE SECURE PAGE */}
                    <button onClick={() => window.location.href = '/admin.html'} className="p-2 rounded-full text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" title="Admin Dashboard">
                      <i className="fas fa-chart-line text-lg"></i>
                    </button>

                    <button className="md:hidden p-2 text-gray-500" onClick={() => setMobileMenuOpen(!mobileMenuOpen)}>
                      <i className={`fas ${mobileMenuOpen ? 'fa-times' : 'fa-bars'} text-xl`}></i>
                    </button>
                  </div>
                </div>

                {/* Mobile Dropdown Menu */}
                {mobileMenuOpen && (
                  <div className="md:hidden absolute top-20 left-0 w-full bg-white/95 dark:bg-[#0a0a0a]/95 backdrop-blur-lg border-b border-gray-200 dark:border-gray-800 shadow-xl py-4 px-4 flex flex-col space-y-2 animate-fade-in z-50">
                    {navItems.map((item) => (
                      <button 
                        key={item.name} 
                        onClick={() => { setCurrentView(item.view); setMobileMenuOpen(false); }} 
                        className={`w-full text-left px-4 py-3 rounded-xl text-base font-medium transition-colors ${currentView === item.view ? 'text-emerald-custom bg-emerald-50 dark:bg-emerald-900/30' : 'text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-800'}`}
                      >
                        {item.name}
                      </button>
                    ))}
                    <div className="pt-4 mt-2 border-t border-gray-200 dark:border-gray-800 flex space-x-4">
                      <button onClick={() => { setCurrentView('ai'); setMobileMenuOpen(false); }} className="flex-1 flex justify-center items-center text-sm font-medium text-emerald-custom border border-emerald-200 dark:border-emerald-800 px-4 py-2 rounded-lg hover:bg-emerald-50 dark:hover:bg-emerald-900/30 transition-colors">
                        <i className="fas fa-magic mr-2"></i> Ask AI
                      </button>
                      <button className="flex-1 flex justify-center items-center text-sm font-medium text-gray-700 dark:text-gray-300 border border-gray-200 dark:border-gray-700 px-4 py-2 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                        <i className="fas fa-search mr-2"></i> Search
                      </button>
                    </div>
                  </div>
                )}
              </header>

              <main className="flex-1">
                {currentView === 'home' && <HomeView setView={setCurrentView} setSelectedItem={setSelectedItem} />}
                {currentView === 'detail' && selectedItem && <PublicationDetailView item={selectedItem} setView={setCurrentView} />}
                {currentView === 'reading' && selectedItem && <ArticleReadingView item={selectedItem} setView={setCurrentView} />}
                {currentView === 'about' && <AboutView />}
                {currentView === 'contact' && <ContactView />}
                {currentView === 'ai' && <AiAssistantView />}
                
                {/* Admin rendering removed from here */}
                
                {currentView === 'library' && renderGenericList('Digital Library', combinedLibrary)}
                {currentView === 'research' && renderGenericList('Research Archive', combinedResearch)}
                {currentView === 'teaching' && renderGenericList('Teaching Hub', mockTeaching)}
                {currentView === 'projects' && renderGenericList('Projects & Initiatives', mockProjects)}
                {currentView === 'journal' && renderGenericList('Personal Journal', combinedJournal)}
                {currentView === 'blog' && renderGenericList('Professional Blog', combinedBlog)}
              </main>
              
              <footer className="relative z-10 border-t border-gray-200 dark:border-gray-800 bg-white dark:bg-[#0a0a0a] pt-16 pb-8 mt-auto">
                <div className="max-w-7xl mx-auto px-4 sm:px-6">
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mb-12">
                    <div>
                      <div className="flex items-center space-x-2 mb-4">
                        <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-navy to-emerald-custom flex items-center justify-center">
                          <span className="text-white font-serif font-bold text-sm">A</span>
                        </div>
                        <span className="font-serif font-bold text-lg text-navy dark:text-white">Ajayi Hub</span>
                      </div>
                      <p className="text-sm text-gray-500 dark:text-gray-400 max-w-xs">
                        A digital knowledge ecosystem for advancing science through research, education, and innovation.
                      </p>
                    </div>
                    <div>
                      <h4 className="font-bold text-navy dark:text-white mb-4">Quick Links</h4>
                      <ul className="space-y-2 text-sm text-gray-500 dark:text-gray-400">
                        <li><button onClick={() => setCurrentView('research')} className="hover:text-emerald-500">Research Archive</button></li>
                        <li><button onClick={() => setCurrentView('library')} className="hover:text-emerald-500">Digital Library</button></li>
                        <li><button onClick={() => setCurrentView('teaching')} className="hover:text-emerald-500">Teaching Materials</button></li>
                        <li><button onClick={() => setCurrentView('contact')} className="hover:text-emerald-500">Collaborate</button></li>
                      </ul>
                    </div>
                    <div>
                      <h4 className="font-bold text-navy dark:text-white mb-4">Connect</h4>
                      <div className="flex space-x-4 text-gray-400">
                        <a href="#" className="hover:text-emerald-500"><i className="fas fa-globe text-xl"></i></a>
                        <a href="#" className="hover:text-emerald-500"><i className="fas fa-users text-xl"></i></a>
                        <a href="#" className="hover:text-emerald-500"><i className="fas fa-chart-line text-xl"></i></a>
                      </div>
                    </div>
                  </div>
                  <div className="border-t border-gray-200 dark:border-gray-800 pt-8 flex flex-col md:flex-row justify-between items-center text-gray-500 dark:text-gray-400 text-sm">
                    <p>© {new Date().getFullYear()} Paul Olakiitan Ajayi. All rights reserved.</p>
                    <div className="flex space-x-4 mt-4 md:mt-0">
                      <a href="#" className="hover:text-emerald-500">Privacy Policy</a>
                      <a href="#" className="hover:text-emerald-500">Terms of Service</a>
                    </div>
                  </div>
                </div>
              </footer>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AjayiKnowledgeHub />);
    </script>
</body>
</html>
