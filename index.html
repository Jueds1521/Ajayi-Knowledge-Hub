<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajayi Knowledge Hub</title>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS & Supabase -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { navy: '#0B1F3A', emerald: '#2E8B57', gold: '#D4AF37', charcoal: '#121212', cardDark: '#1E1E1E' },
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Merriweather', 'serif'] },
                    animation: { 'float': 'float 20s infinite linear' },
                    keyframes: {
                        float: {
                            '0%': { transform: 'translateY(100vh) scale(0.5)', opacity: '0' },
                            '10%': { opacity: '0.4' },
                            '90%': { opacity: '0.4' },
                            '100%': { transform: 'translateY(-10vh) scale(1.2)', opacity: '0' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body::-webkit-scrollbar { width: 8px; }
        body::-webkit-scrollbar-track { background: transparent; }
        body::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        .dark body::-webkit-scrollbar-thumb { background-color: #334155; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Solid Navbar styling */
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .dark .glass-nav { background: rgba(11, 20, 35, 0.95); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .animate-slide-down { animation: slideDown 0.3s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.6s ease-out forwards; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-charcoal text-gray-900 dark:text-gray-100 transition-colors duration-300 antialiased font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, Fragment } = React;

        const supabaseUrl = 'https://ulqihwnzujncqpexersp.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVscWlod256dWpuY3FwZXhlcnNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNDIxNjMsImV4cCI6MjEwMDgxODE2M30.vvMQLeUtjVmciJxwqVgiFVZjmHlclY0Z-oHngY3SVso';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                book: <Fragment><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><path d="M8 7h6"/><path d="M8 11h8"/></Fragment>,
                microscope: <path d="M6 18h8 M3 22h18 M14 22a7 7 0 1 0 0-14h-1 M9 14h2 M9 12a2 2 0 0 1-2-2V6h6v4a2 2 0 0 1-2 2Z M12 6V3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3"/>,
                gradCap: <path d="M22 10v6M2 10l10-5 10 5-10 5z M6 12v5c3 3 9 3 12 0v-5"/>,
                pencil: <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z M15 5l4 4"/>,
                menu: <path d="M4 12h16M4 6h16M4 18h16"/>,
                x: <path d="M18 6 6 18M6 6l12 12"/>,
                sun: <path d="M12 3v1M12 20v1M4.22 4.22l.71.71M19.07 19.07l.71.71M1 12h1M20 12h1M4.22 19.78l.71-.71M19.07 4.93l.71-.71M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10z"/>,
                moon: <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>,
                download: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M7 10l5 5 5-5 M12 15V3"/>,
                layout: <Fragment><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></Fragment>,
                users: <Fragment><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></Fragment>,
                chart: <Fragment><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></Fragment>,
                magic: <Fragment><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="6.5"/></Fragment>,
                search: <Fragment><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Fragment>,
                globe: <Fragment><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></Fragment>,
                envelope: <Fragment><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></Fragment>,
                send: <Fragment><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></Fragment>,
                facebook: <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>,
                linkedin: <Fragment><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></Fragment>,
                whatsapp: <Fragment><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></Fragment>,
                orcid: <Fragment><circle cx="12" cy="12" r="10"/><path d="M8 7h2.5v10H8V7zM12 7h2.5c2 0 3.5 1.5 3.5 3.5v3c0 2-1.5 3.5-3.5 3.5H12V7zM14 9v6h.5c1 0 1.5-.8 1.5-1.5v-3C16 9.8 15.5 9 14.5 9H14z"/></Fragment>,
                paperclip: <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
            };
            return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{icons[name] || icons.book}</svg>;
        };

        const ParticleBackground = ({ isDarkMode }) => {
            const canvasRef = useRef(null);
            
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;
                let animationFrameId;
                let particles = [];
                
                const resize = () => { if(canvas) {canvas.width = window.innerWidth; canvas.height = window.innerHeight;} };
                window.addEventListener('resize', resize);
                resize();
                
                class Particle {
                    constructor() {
                        this.x = Math.random() * canvas.width; 
                        this.y = Math.random() * canvas.height;
                        this.vx = (Math.random() - 0.5) * 0.8; 
                        this.vy = (Math.random() - 0.5) * 0.8;
                        this.size = Math.random() * 6 + 3; 
                        this.type = Math.floor(Math.random() * 3); 
                        this.angle = Math.random() * Math.PI * 2;
                        this.va = (Math.random() - 0.5) * 0.02; 
                    }
                    update() {
                        this.x += this.vx; this.y += this.vy;
                        this.angle += this.va;
                        if (this.x < -50 || this.x > canvas.width + 50) this.vx = -this.vx;
                        if (this.y < -50 || this.y > canvas.height + 50) this.vy = -this.vy;
                    }
                    draw() {
                        ctx.save();
                        ctx.translate(this.x, this.y);
                        ctx.rotate(this.angle);
                        
                        ctx.fillStyle = isDarkMode ? 'rgba(46, 139, 87, 0.45)' : 'rgba(11, 31, 58, 0.3)';
                        ctx.strokeStyle = isDarkMode ? 'rgba(46, 139, 87, 0.65)' : 'rgba(11, 31, 58, 0.5)';
                        ctx.lineWidth = 2;

                        ctx.beginPath();
                        if (this.type === 0) { // Diplococci
                            ctx.arc(-this.size/1.5, 0, this.size/1.2, 0, Math.PI * 2);
                            ctx.arc(this.size/1.5, 0, this.size/1.2, 0, Math.PI * 2);
                            ctx.fill();
                        } else if (this.type === 1) { // Bacilli
                            ctx.arc(-this.size, 0, this.size/1.5, Math.PI/2, Math.PI*1.5);
                            ctx.lineTo(this.size, -this.size/1.5);
                            ctx.arc(this.size, 0, this.size/1.5, -Math.PI/2, Math.PI/2);
                            ctx.closePath();
                            ctx.fill();
                        } else { // Spirilla
                            ctx.moveTo(-this.size * 2, 0);
                            ctx.bezierCurveTo(-this.size, -this.size*2, this.size, this.size*2, this.size * 2, 0);
                            ctx.stroke();
                        }
                        ctx.restore();
                    }
                }
                
                for (let i = 0; i < 35; i++) particles.push(new Particle());
                
                const animate = () => {
                    if (!ctx || !canvas) return;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    particles.forEach(p => { p.update(); p.draw(); });
                    
                    particles.forEach((p1, i) => {
                        particles.slice(i + 1).forEach(p2 => {
                            const dist = Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
                            if (dist < 130) {
                                ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
                                ctx.strokeStyle = isDarkMode ? `rgba(46, 139, 87, ${0.4 - dist/325})` : `rgba(11, 31, 58, ${0.3 - dist/433})`; 
                                ctx.lineWidth = 1;
                                ctx.stroke();
                            }
                        });
                    });
                    animationFrameId = requestAnimationFrame(animate);
                };
                animate();
                return () => { window.removeEventListener('resize', resize); if (animationFrameId) cancelAnimationFrame(animationFrameId); };
            }, [isDarkMode]);
            
            return <canvas ref={canvasRef} className="absolute top-0 left-0 w-full h-full pointer-events-none z-10 opacity-70" />;
        };

        const Navbar = ({ darkMode, setDarkMode, setView, currentView, settings }) => {
            const [mobileMenu, setMobileMenu] = useState(false);
            
            // Lock body scroll when menu is open
            useEffect(() => {
                if (mobileMenu) document.body.style.overflow = 'hidden';
                else document.body.style.overflow = 'unset';
                return () => { document.body.style.overflow = 'unset'; };
            }, [mobileMenu]);

            const navLinks = [
                { name: 'Home', id: 'home', icon: 'layout' },
                { name: 'Library', id: 'library', icon: 'book' },
                { name: 'Research', id: 'research', icon: 'microscope' },
                { name: 'Journal', id: 'journal', icon: 'layout' },
                { name: 'Teaching', id: 'teaching', icon: 'gradCap' },
                { name: 'Blog', id: 'blog', icon: 'pencil' },
                { name: 'Projects', id: 'projects', icon: 'chart' },
                { name: 'About', id: 'about', icon: 'users' },
                { name: 'Contact', id: 'contact', icon: 'envelope' },
            ];

            return (
                <nav className="glass-nav text-gray-900 dark:text-white w-full fixed top-0 z-50 transition-colors">
                    <div className="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex justify-between items-center h-20">
                            
                            {/* Logo */}
                            <div className="flex-shrink-0 cursor-pointer flex items-center gap-3" onClick={() => { setView('home'); setMobileMenu(false); }}>
                                {settings?.logo_url ? (
                                    <img src={settings.logo_url} alt="Logo" className="w-10 h-10 rounded-lg object-cover shadow-sm" />
                                ) : (
                                    <div className="text-[#D4AF37] dark:text-[#2E8B57]">
                                        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                                            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><path d="M8 7h6"/><path d="M8 11h8"/>
                                        </svg>
                                    </div>
                                )}
                                <div className="flex flex-col">
                                    <h1 className="font-serif font-bold text-xl leading-tight text-[#0B1423] dark:text-white">Ajayi Knowledge Hub</h1>
                                    <span className="text-[#D4AF37] dark:text-[#2E8B57] text-[10px] tracking-wider uppercase font-medium">Explore. Learn. Discover. Grow.</span>
                                </div>
                            </div>
                            
                            {/* Actions (Solid buttons to pop out) */}
                            <div className="flex items-center space-x-2 sm:space-x-3">
                                <button onClick={() => setView('ai')} className="hidden sm:flex items-center px-4 py-2 rounded-xl bg-white dark:bg-[#0B1423] text-[#2E8B57] border border-[#2E8B57]/30 dark:border-[#2E8B57]/50 hover:bg-[#2E8B57] hover:text-white text-sm font-bold transition-all shadow-sm">
                                    <Icon name="magic" size={16} className="mr-2" /> Ask AI
                                </button>
                                <button className="w-10 h-10 rounded-xl bg-white dark:bg-[#0B1423] border border-gray-200 dark:border-white/10 flex items-center justify-center text-gray-600 dark:text-gray-300 hover:text-[#2E8B57] dark:hover:text-[#2E8B57] transition-all shadow-sm hidden xs:flex">
                                    <Icon name="search" size={18} />
                                </button>
                                <button onClick={() => setDarkMode(!darkMode)} className="w-10 h-10 rounded-xl bg-white dark:bg-[#0B1423] border border-gray-200 dark:border-white/10 flex items-center justify-center text-gray-600 dark:text-gray-300 hover:text-[#2E8B57] dark:hover:text-[#2E8B57] transition-all shadow-sm">
                                    {darkMode ? <Icon name="sun" size={18} /> : <Icon name="moon" size={18} />}
                                </button>
                                
                                {/* SOLID Hamburger Menu Button */}
                                <button onClick={() => setMobileMenu(!mobileMenu)} className="w-12 h-12 rounded-xl bg-white dark:bg-[#0B1423] border border-gray-200 dark:border-white/20 flex items-center justify-center text-gray-800 dark:text-white hover:text-[#2E8B57] dark:hover:text-[#2E8B57] hover:border-[#2E8B57] transition-all shadow-md relative z-50">
                                    <Icon name={mobileMenu ? "x" : "menu"} size={26} />
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Dark Background Overlay (Blurs out the site when menu is open) */}
                    {mobileMenu && (
                        <div className="fixed inset-0 top-20 bg-black/40 backdrop-blur-sm z-30" onClick={() => setMobileMenu(false)}></div>
                    )}

                    {/* Universal Solid Dropdown Menu (No Transparency) */}
                    {mobileMenu && (
                        <div className="absolute top-full left-0 w-full bg-white dark:bg-[#0B1423] z-40 overflow-y-auto max-h-[80vh] px-4 py-8 animate-slide-down flex flex-col shadow-2xl border-t border-gray-200 dark:border-white/10">
                            <div className="max-w-3xl mx-auto w-full grid grid-cols-1 sm:grid-cols-2 gap-3">
                                {navLinks.map(link => (
                                    <button 
                                        key={link.id} 
                                        onClick={() => { setView(link.id); setMobileMenu(false); }}
                                        className={`flex items-center w-full text-left px-6 py-4 rounded-xl text-lg font-bold transition-all transform hover:scale-[1.02] shadow-sm ${currentView === link.id ? 'bg-[#2E8B57] text-white' : 'bg-gray-50 dark:bg-gray-800 text-gray-800 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 hover:text-gray-900 dark:hover:text-white border border-gray-200 dark:border-gray-700'}`}
                                    >
                                        <Icon name={link.icon} size={20} className="mr-4 opacity-70" />
                                        {link.name}
                                    </button>
                                ))}
                            </div>
                            <div className="max-w-3xl mx-auto w-full mt-8 pt-8 border-t border-gray-200 dark:border-gray-800">
                                <a href="/admin.html" className="flex justify-center items-center px-6 py-4 rounded-xl bg-gray-100 dark:bg-[#D4AF37]/10 text-gray-800 dark:text-[#D4AF37] border border-gray-200 dark:border-[#D4AF37]/30 hover:bg-gray-200 dark:hover:bg-[#D4AF37]/20 font-bold transition-colors w-full shadow-sm">
                                    <Icon name="users" size={20} className="mr-3" /> Login to Admin Portal
                                </a>
                            </div>
                        </div>
                    )}
                </nav>
            );
        };

        const PublicationDetailView = ({ item, setView }) => {
            const [showCitation, setShowCitation] = useState(false);
            
            const handleDownload = async (url) => {
                if(window.supabase) await window.supabase.rpc('increment_download');
                window.open(url, '_blank');
            };

            return (
                <div className="max-w-5xl mx-auto px-4 sm:px-6 pt-32 pb-24 relative z-10 min-h-screen animate-fade-in">
                    <button onClick={() => window.history.back()} className="flex items-center text-[#2E8B57] hover:opacity-80 transition-opacity mb-8 font-medium">
                        &larr; Back
                    </button>
                    
                    <div className="bg-white dark:bg-[#1E1E1E] rounded-3xl p-8 shadow-xl border border-gray-100 dark:border-gray-800 mb-12">
                        <div className="flex flex-col md:flex-row gap-10">
                            <div className="w-full md:w-1/3 flex-shrink-0">
                                <div className="aspect-[3/4] bg-gradient-to-br from-[#0B1423] to-[#1a365d] dark:from-gray-800 dark:to-gray-950 rounded-2xl shadow-lg flex flex-col items-center justify-center p-6 text-center border border-gray-200 dark:border-gray-700 relative overflow-hidden">
                                    <Icon name={item.type === 'book' ? 'book' : 'microscope'} size={80} className="text-[#2E8B57] opacity-20 absolute" />
                                    <h3 className="text-white font-serif font-bold text-xl leading-tight z-10">{item.title}</h3>
                                </div>
                            </div>
                            <div className="w-full md:w-2/3 flex flex-col justify-center min-w-0">
                                <div className="flex items-center space-x-3 mb-4 flex-wrap">
                                    <span className="px-3 py-1 bg-[#2E8B57]/10 text-[#2E8B57] rounded-full text-xs font-bold uppercase tracking-wider mb-2 sm:mb-0">{item.category}</span>
                                    <span className="text-gray-500 dark:text-gray-400 text-sm font-medium">{item.published_date}</span>
                                </div>
                                <h1 className="text-3xl md:text-5xl font-bold font-serif text-[#0B1423] dark:text-white mb-6 leading-tight break-words">{item.title}</h1>
                                
                                <div className="flex flex-wrap gap-2 mb-6">
                                    {(item.tags || []).map(tag => (
                                        <span key={tag} className="text-xs text-gray-500 bg-gray-100 dark:bg-gray-800 px-2 py-1 rounded-md">#{tag}</span>
                                    ))}
                                </div>

                                <p className="text-gray-600 dark:text-gray-300 text-lg leading-relaxed mb-8">{item.summary}</p>
                                
                                <div className="flex flex-wrap gap-4 mt-auto">
                                    {item.file_url ? (
                                        <button onClick={() => handleDownload(item.file_url)} className="flex items-center bg-[#2E8B57] hover:bg-[#257348] text-white px-6 py-3 rounded-xl font-medium transition-all shadow-md">
                                            <Icon name="download" size={18} className="mr-2" /> Download PDF
                                        </button>
                                    ) : (
                                        <button disabled className="flex items-center bg-gray-200 dark:bg-gray-800 text-gray-400 px-6 py-3 rounded-xl font-medium cursor-not-allowed">
                                            No PDF Attached
                                        </button>
                                    )}
                                    <button onClick={() => setShowCitation(!showCitation)} className="flex items-center bg-gray-100 dark:bg-gray-800 text-[#0B1423] dark:text-white px-6 py-3 rounded-xl font-medium transition-all">
                                        Cite
                                    </button>
                                </div>

                                {showCitation && (
                                    <div className="mt-4 p-4 bg-gray-50 dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 animate-fade-in text-sm font-serif break-words">
                                        Ajayi, P. O. ({item.published_date}). <i>{item.title}</i>.
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const ArticleReadingView = ({ item, setView }) => {
            const handleDownload = async (url) => {
                if(window.supabase) await window.supabase.rpc('increment_download');
                window.open(url, '_blank');
            };

            return (
                <div className="max-w-3xl mx-auto px-4 sm:px-6 pt-32 pb-24 relative z-10 min-h-screen animate-fade-in">
                    <button onClick={() => window.history.back()} className="flex items-center text-[#2E8B57] hover:opacity-80 transition-opacity mb-8 font-medium">
                        &larr; Back
                    </button>
                    <article className="max-w-none break-words">
                        <div className="text-center mb-12">
                            <span className="px-3 py-1 bg-[#2E8B57]/10 text-[#2E8B57] rounded-full text-xs font-bold uppercase tracking-wider inline-block mb-4">{item.category}</span>

                        </div>
                        <div className="pl-8 relative z-10">
                            <h3 className="font-serif font-bold text-lg mb-4 dark:text-white flex items-center gap-2">Quote of the Day</h3>
                            <p className="text-gray-700 dark:text-gray-300 font-serif italic mb-4">"The beautiful thing about learning is that no one can take it away from you."</p>
                            <div className="text-sm font-bold text-[#2E8B57]">- B.B. King</div>
                        </div>
                    </div>

                    {/* Newsletter */}
                    <div className="bg-white dark:bg-[#1E1E1E] rounded-xl border border-gray-200 dark:border-gray-800 p-8 shadow-sm min-w-0">
                        <h3 className="font-serif font-bold text-lg mb-2 dark:text-white flex items-center gap-2">
                            <Icon name="pencil" size={20} className="text-gray-500" /> Stay Updated
                        </h3>
                        <p className="text-sm text-gray-600 dark:text-gray-400 mb-6">Subscribe to my newsletter and never miss new research, books, and insights.</p>
                        <form className="flex gap-2 w-full" onSubmit={(e) => { e.preventDefault(); alert("Thanks for subscribing!"); }}>
                            <input type="email" required placeholder="Email" className="w-full min-w-0 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-[#2E8B57]" />
                            <button className="shrink-0 bg-[#2E8B57] hover:bg-[#257348] text-white px-4 sm:px-6 py-2 rounded-lg text-sm font-medium transition-colors">Join</button>
                        </form>
                    </div>

                    {/* Socials */}
                    <div className="bg-white dark:bg-[#1E1E1E] rounded-xl border border-gray-200 dark:border-gray-800 p-8 shadow-sm min-w-0 md:col-span-2 lg:col-span-1">
                        <h3 className="font-serif font-bold text-lg mb-2 dark:text-white flex items-center gap-2">
                             <Icon name="globe" size={20} className="text-gray-500" /> Let's Connect
                        </h3>
                        <p className="text-sm text-gray-600 dark:text-gray-400 mb-6">Join a community of learners building a better future through knowledge.</p>
                        <div className="flex flex-wrap gap-3">
                            {settings?.linkedin_url && (
                                <a href={settings.linkedin_url} target="_blank" className="w-10 h-10 rounded-full bg-[#0077b5] text-white flex items-center justify-center hover:opacity-90">
                                    <span className="font-bold text-lg">in</span>
                                </a>
                            )}
                            {settings?.facebook_url && (
                                <a href={settings.facebook_url} target="_blank" className="w-10 h-10 rounded-full bg-[#1877F2] text-white flex items-center justify-center hover:opacity-90">
                                    <span className="font-bold text-lg text-center leading-none mt-1">f</span>
                                </a>
                            )}
                            {settings?.orcid_url && (
                                <a href={settings.orcid_url} target="_blank" className="w-10 h-10 rounded-full bg-[#A6CE39] text-white flex items-center justify-center hover:opacity-90">
                                    <span className="font-bold text-[10px]">iD</span>
                                </a>
                            )}
                            {settings?.whatsapp_number && (
                                <a href={`https://wa.me/${settings.whatsapp_number.replace(/\D/g,'')}`} target="_blank" className="w-10 h-10 rounded-full bg-[#25D366] text-white flex items-center justify-center hover:opacity-90">
                                    <span className="font-bold text-lg">W</span>
                                </a>
                            )}
                        </div>
                    </div>
                </div>
            </div>
        );

        const Footer = () => (
            <footer className="bg-[#0B1423] py-8 text-gray-400 text-sm border-t border-white/10">
                <div className="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-6 text-center md:text-left">
                    <div className="flex items-center gap-3 justify-center md:justify-start">
                         <div className="text-[#D4AF37]">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                                <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><path d="M8 7h6"/><path d="M8 11h8"/>
                            </svg>
                        </div>
                        <div>
                            <h2 className="text-white font-serif font-bold text-lg leading-none">Ajayi Knowledge Hub</h2>
                            <span className="text-[#D4AF37] text-[10px] tracking-wider uppercase font-medium block mt-1">Explore. Learn. Discover. Grow.</span>
                        </div>
                    </div>
                    
                    <div className="flex-1">
                        <p>&copy; {new Date().getFullYear()} Paul Olakiitan Ajayi. All rights reserved.</p>
                        <div className="flex gap-4 justify-center mt-2 text-xs">
                            <span className="hover:text-white cursor-pointer">Privacy Policy</span>
                            <span className="hover:text-white cursor-pointer">Terms of Use</span>
                            <span className="hover:text-white cursor-pointer">Sitemap</span>
                        </div>
                    </div>
                    
                    <div>
                        Built with <span className="text-red-500">♥</span> for knowledge, science, and humanity.
                    </div>
                </div>
            </footer>
        );

        const App = () => {
            const [darkMode, setDarkMode] = useState(true);
            const [view, setView] = useState('home');
            const [selectedItem, setSelectedItem] = useState(null);
            const [publications, setPublications] = useState([]);
            const [settings, setSettings] = useState(null);

            useEffect(() => {
                if (darkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [darkMode]);

            useEffect(() => {
                const fetchData = async () => {
                    if (!window.supabase) return;
                    
                    const { data: pubs } = await supabase.from('publications').select('*').order('id', { ascending: false });
                    if (pubs) setPublications(pubs);

                    const { data: sets } = await supabase.from('site_settings').select('*').eq('id', 1).single();
                    if (sets) setSettings(sets);

                    if (!sessionStorage.getItem('view_counted')) {
                        await supabase.rpc('increment_page_view');
                        sessionStorage.setItem('view_counted', 'true');
                    }
                };
                fetchData();
            }, []);

            const navigateTo = (newView, item = null) => {
                setView(newView);
                setSelectedItem(item);
                window.scrollTo(0, 0);
                
                // Try-catch block prevents preview iframe crashes while keeping Vercel functionality intact
                try {
                    window.history.pushState({ view: newView, item }, '', `?view=${newView}`);
                } catch (error) {
                    console.warn("History API blocked in preview environment, but navigation will continue.");
                }
            };

            useEffect(() => {
                const handlePopState = (e) => {
                    if (e.state && e.state.view) { setView(e.state.view); setSelectedItem(e.state.item); }
                    else setView('home');
                };
                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, []);

            const books = publications.filter(p => p.type === 'book');
            const research = publications.filter(p => p.type === 'research');
            const journal = publications.filter(p => p.type === 'journal');
            const blog = publications.filter(p => p.type === 'blog');
            const teaching = publications.filter(p => p.type === 'teaching');
            const projects = publications.filter(p => p.type === 'project');

            const HomeContent = () => (
                <div className="bg-gray-50 dark:bg-[#121212] relative z-10 pb-10">
                    <HeroSection setView={navigateTo} isDarkMode={darkMode} />

                    <div className="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 -mt-6 relative z-20 mb-12 animate-fade-in">
                        <div className="bg-[#0f1b29] rounded-xl shadow-xl flex flex-wrap lg:flex-nowrap divide-y lg:divide-y-0 lg:divide-x divide-white/10 p-2">
                            {[
                                { count: books.length, label: "Books", icon: "book" },
                                { count: research.length, label: "Research", icon: "microscope" },
                                { count: journal.length, label: "Journal", icon: "layout" },
                                { count: teaching.length, label: "Teaching", icon: "gradCap" },
                                { count: blog.length, label: "Blog", icon: "pencil" },
                                { count: (settings?.views_count || 0).toLocaleString(), label: "Global Readers", icon: "users" },
                                { count: (settings?.downloads_count || 0).toLocaleString(), label: "Downloads", icon: "download" },
                            ].map((stat, idx) => (
                                <div key={idx} className="flex-1 min-w-[140px] p-4 flex items-center justify-center lg:justify-start gap-4">
                                    <div className="text-[#D4AF37]"><Icon name={stat.icon} size={28} /></div>
                                    <div className="min-w-0">
                                        <div className="text-white font-bold text-xl leading-none mb-1 truncate">{stat.count}</div>
                                        <div className="text-gray-400 text-xs truncate">{stat.label}</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <ContentCards navigateTo={navigateTo} books={books} research={research} journal={journal} blog={blog} projects={projects} />
                    <BottomInfo settings={settings} />
                </div>
            );

            const GenericList = ({ title, data }) => (
                <div className="pt-32 pb-24 max-w-7xl mx-auto px-4 sm:px-6 relative z-10 min-h-screen animate-fade-in">
                    <h1 className="text-4xl font-bold font-serif text-[#0B1423] dark:text-white mb-12">{title}</h1>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                        {data.map(item => (
                            <div key={item.id} className="bg-white dark:bg-[#1E1E1E] rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-gray-800 flex flex-col cursor-pointer min-w-0" onClick={() => navigateTo((item.type === 'journal' || item.type === 'blog') ? 'reading' : 'detail', item)}>
                                <span className="text-xs font-bold uppercase text-[#2E8B57] mb-2 truncate">{item.category}</span>
                                <h3 className="text-xl font-bold text-[#0B1423] dark:text-white mb-3 line-clamp-2">{item.title}</h3>
                                {item.file_url && <Icon name="paperclip" size={16} className="text-gray-400 mb-2" />}
                                <p className="text-sm text-gray-600 dark:text-gray-400 mb-6 flex-grow line-clamp-4 break-words">{item.summary}</p>
                                <div className="mt-auto flex items-center text-[#2E8B57] text-sm font-semibold">Read More &rarr;</div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col selection:bg-[#2E8B57] selection:text-white">
                    <Navbar darkMode={darkMode} setDarkMode={setDarkMode} setView={navigateTo} currentView={view} settings={settings} />
                    <main className="flex-grow">
                        {view === 'home' && <HomeContent />}
                        {view === 'detail' && selectedItem && <PublicationDetailView item={selectedItem} setView={setView} />}
                        {view === 'reading' && selectedItem && <ArticleReadingView item={selectedItem} setView={setView} />}
                        {view === 'about' && <AboutView settings={settings} />}
                        {view === 'contact' && <ContactView settings={settings} />}
                        {view === 'ai' && <AiAssistantView />}
                        {view === 'library' && <GenericList title="Library" data={books} />}
                        {view === 'research' && <GenericList title="Research" data={research} />}
                        {view === 'teaching' && <GenericList title="Teaching" data={teaching} />}
                        {view === 'projects' && <GenericList title="Projects" data={projects} />}
                        {view === 'journal' && <GenericList title="Journal" data={journal} />}
                        {view === 'blog' && <GenericList title="Blog" data={blog} />}
                    </main>
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
