<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Ajayi Knowledge Hub</title>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS & Supabase -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { navy: '#0B1F3A', 'emerald-custom': '#2E8B57' }, fontFamily: { serif: ['Merriweather', 'serif'], sans: ['Inter', 'sans-serif'] } } }
        }
    </script>
    <style>body { background-color: #0a0a0a; color: #F9FAFB; } .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; } @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }</style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const supabaseUrl = 'https://ulqihwnzujncqpexersp.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVscWlod256dWpuY3FwZXhlcnNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNDIxNjMsImV4cCI6MjEwMDgxODE2M30.vvMQLeUtjVmciJxwqVgiFVZjmHlclY0Z-oHngY3SVso';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const AdminDashboardView = ({ onLogout }) => {
            const [activeTab, setActiveTab] = useState('analytics'); // Set Analytics as default
            
            // CMS State
            const [title, setTitle] = useState(''); 
            const [type, setType] = useState('blog'); 
            const [category, setCategory] = useState('');
            const [summary, setSummary] = useState(''); 
            const [content, setContent] = useState(''); 
            const [tags, setTags] = useState('');
            const [file, setFile] = useState(null); 
            const [thumbnailFile, setThumbnailFile] = useState(null);
            const [thumbnailUrl, setThumbnailUrl] = useState('');
            const [isPublishing, setIsPublishing] = useState(false); 
            const [editingId, setEditingId] = useState(null);
            
            // Data State
            const [publications, setPublications] = useState([]);
            const [messages, setMessages] = useState([]);
            const [subscribers, setSubscribers] = useState([]);
            const [settings, setSettings] = useState({ 
                display_name: '', bio: '', about_text: '', mission_text: '', 
                hero_title: '', hero_subtitle: '', footer_text: '',
                profile_pic_url: '', logo_url: '', linkedin_url: '', 
                facebook_url: '', orcid_url: '', whatsapp_number: '',
                twitter_url: '', youtube_url: '',
                daily_quote: '', quote_author: '', views_count: 0, downloads_count: 0
            });
            
            // UI State
            const [statusMsg, setStatusMsg] = useState({ type: '', text: '' });
            const [settingsStatus, setSettingsStatus] = useState({ type: '', text: '' });

            const fetchData = async () => {
                const { data: pubs } = await supabase.from('publications').select('*').order('id', { ascending: false });
                if (pubs) setPublications(pubs);
                
                const { data: msgs } = await supabase.from('messages').select('*').order('created_at', { ascending: false });
                if (msgs) setMessages(msgs);
                
                const { data: subs } = await supabase.from('subscribers').select('*').order('created_at', { ascending: false });
                if (subs) setSubscribers(subs);

                const { data: sets } = await supabase.from('site_settings').select('*').eq('id', 1).single();
                if (sets) setSettings({ ...settings, ...sets });
            };

            useEffect(() => { fetchData(); }, []);

            // --- CONTENT MANAGEMENT (CRUD) ---
            const handlePublish = async (e) => {
                e.preventDefault(); 
                setIsPublishing(true);
                setStatusMsg({ type: '', text: '' });
                
                try {
                    let fileUrl = null;
                    if (file) {
                        const cleanName = file.name.replace(/[^a-zA-Z0-9.\-_]/g, '');
                        const fileName = `${Date.now()}_${cleanName}`;
                        const { error: uploadError } = await supabase.storage.from('documents').upload(fileName, file);
                        if (uploadError) throw uploadError;
                        fileUrl = supabase.storage.from('documents').getPublicUrl(fileName).data.publicUrl;
                    }
                    
                    let finalThumbUrl = thumbnailUrl;
                    if (thumbnailFile) {
                        const cleanThumb = thumbnailFile.name.replace(/[^a-zA-Z0-9.\-_]/g, '');
                        const thumbName = `thumb_${Date.now()}_${cleanThumb}`;
                        const { error: thumbUploadError } = await supabase.storage.from('images').upload(thumbName, thumbnailFile);
                        if (thumbUploadError) throw thumbUploadError;
                        finalThumbUrl = supabase.storage.from('images').getPublicUrl(thumbName).data.publicUrl;
                    }
                    
                    const payload = { 
                        title, type, category, summary, content, 
                        tags: tags.split(',').map(t => t.trim()).filter(Boolean) 
                    };
                    if (fileUrl) payload.file_url = fileUrl;
                    if (finalThumbUrl) payload.thumbnail_url = finalThumbUrl;
                    
                    if (editingId) {
                        const { error } = await supabase.from('publications').update(payload).eq('id', editingId);
                        if (error) throw error;
                        setStatusMsg({ type: 'success', text: 'Publication updated successfully!' });
                    } else { 
                        payload.published_date = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }); 
                        const { error } = await supabase.from('publications').insert([payload]); 
                        if (error) throw error;
                        setStatusMsg({ type: 'success', text: 'New publication published successfully!' });
                    }
                    
                    setEditingId(null); setTitle(''); setCategory(''); setSummary(''); setContent(''); setTags(''); setFile(null); setThumbnailFile(null); setThumbnailUrl('');
                    fetchData();
                } catch (error) { 
                    setStatusMsg({ type: 'error', text: 'Error: ' + error.message }); 
                }
                setIsPublishing(false);
                setTimeout(() => setStatusMsg({ type: '', text: '' }), 5000);
            };

            const handleEdit = (pub) => {
                setEditingId(pub.id); setTitle(pub.title || ''); setType(pub.type || 'blog');
                setCategory(pub.category || ''); setSummary(pub.summary || ''); setContent(pub.content || '');
                setTags((pub.tags || []).join(', ')); setThumbnailUrl(pub.thumbnail_url || '');
                window.scrollTo({ top: 0, behavior: 'smooth' });
                setStatusMsg({ type: 'success', text: `Editing: ${pub.title}` });
            };

            const handleDelete = async (id, title) => {
                if (!window.confirm(`Are you absolutely sure you want to delete "${title}"? This cannot be undone.`)) return;
                try {
                    const { error } = await supabase.from('publications').delete().eq('id', id);
                    if (error) throw error;
                    setStatusMsg({ type: 'success', text: 'Publication deleted successfully.' });
                    fetchData();
                } catch (error) { setStatusMsg({ type: 'error', text: 'Delete Error: ' + error.message }); }
                setTimeout(() => setStatusMsg({ type: '', text: '' }), 5000);
            };

            const cancelEdit = () => {
                setEditingId(null); setTitle(''); setCategory(''); setSummary(''); setContent(''); setTags(''); setFile(null); setThumbnailFile(null); setThumbnailUrl('');
                setStatusMsg({ type: '', text: '' });
            };

            // --- SETTINGS MANAGEMENT ---
            const handleSettingsUpdate = async (e) => {
                e.preventDefault(); 
                setSettingsStatus({ type: 'success', text: 'Saving settings to database...' });
                try {
                    const { error } = await supabase.from('site_settings').upsert({ id: 1, ...settings });
                    if (error) throw error;
                    setSettingsStatus({ type: 'success', text: 'All settings saved and live on website!' });
                } catch (error) { 
                    setSettingsStatus({ type: 'error', text: 'Error saving: ' + error.message }); 
                }
                setTimeout(() => setSettingsStatus({ type: '', text: '' }), 6000);
            };

            const handleImageUpload = async (e, fieldName) => {
                const img = e.target.files[0];
                if (!img) return;
                setSettingsStatus({ type: 'success', text: 'Uploading Image... Please wait.' });
                try {
                    const cleanName = img.name.replace(/[^a-zA-Z0-9.\-_]/g, '');
                    const fileName = `${Date.now()}_${cleanName}`;
                    const { error: uploadError } = await supabase.storage.from('images').upload(fileName, img);
                    
                    if (uploadError) throw new Error(uploadError.message || "Failed to upload image.");
                    
                    const url = supabase.storage.from('images').getPublicUrl(fileName).data.publicUrl;
                    setSettings(prev => ({ ...prev, [fieldName]: url }));
                    setSettingsStatus({ type: 'success', text: 'Image uploaded! Now click "Save All Settings" at the bottom.' });
                } catch (error) { 
                    setSettingsStatus({ type: 'error', text: 'Upload Error: ' + error.message }); 
                }
            };

            const handleGenerateQuote = async () => {
                setSettingsStatus({ type: 'success', text: 'Fetching inspiring quote...' });
                try {
                    const res = await fetch('https://dummyjson.com/quotes/random');
                    const data = await res.json();
                    setSettings(prev => ({ ...prev, daily_quote: data.quote, quote_author: data.author }));
                    setSettingsStatus({ type: 'success', text: 'Quote updated! You can edit it below, then click "Save All Settings".' });
                } catch (error) {
                    setSettingsStatus({ type: 'error', text: 'Failed to fetch online quote. Please type one manually.' });
                }
            };

            return (
                <div className="min-h-screen bg-[#0a0a0a] flex animate-fade-in">
                    {/* Sidebar */}
                    <div className="w-64 bg-gray-900 border-r border-gray-800 flex flex-col">
                        <div className="p-6 border-b border-gray-800">
                            <h2 className="font-serif font-bold text-white text-xl">Admin Portal</h2>
                            <p className="text-xs text-gray-400 mt-1">Ajayi Knowledge Hub</p>
                        </div>
                        <nav className="p-4 space-y-2 flex-1">
                            <button onClick={() => setActiveTab('analytics')} className={`w-full text-left px-4 py-3 rounded-xl transition font-medium ${activeTab==='analytics'?'bg-blue-900/30 text-blue-400':'text-gray-400 hover:bg-gray-800'}`}><i className="fas fa-chart-line w-6"></i> Analytics & Growth</button>
                            <button onClick={() => setActiveTab('cms')} className={`w-full text-left px-4 py-3 rounded-xl transition font-medium ${activeTab==='cms'?'bg-emerald-900/30 text-emerald-400':'text-gray-400 hover:bg-gray-800'}`}><i className="fas fa-edit w-6"></i> Content CMS</button>
                            <button onClick={() => setActiveTab('inbox')} className={`w-full flex justify-between items-center px-4 py-3 rounded-xl transition font-medium ${activeTab==='inbox'?'bg-emerald-900/30 text-emerald-400':'text-gray-400 hover:bg-gray-800'}`}>
                                <span><i className="fas fa-envelope w-6"></i> Inbox</span>
                                {messages.length > 0 && <span className="bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full">{messages.length}</span>}
                            </button>
                            <button onClick={() => setActiveTab('subscribers')} className={`w-full text-left px-4 py-3 rounded-xl transition font-medium ${activeTab==='subscribers'?'bg-emerald-900/30 text-emerald-400':'text-gray-400 hover:bg-gray-800'}`}><i className="fas fa-users w-6"></i> Subscribers</button>
                            <button onClick={() => setActiveTab('settings')} className={`w-full text-left px-4 py-3 rounded-xl transition font-medium ${activeTab==='settings'?'bg-emerald-900/30 text-emerald-400':'text-gray-400 hover:bg-gray-800'}`}><i className="fas fa-cog w-6"></i> Web Settings</button>
                        </nav>
                        <button onClick={onLogout} className="m-4 text-left px-4 py-3 text-red-400 hover:bg-red-900/20 rounded-xl transition-colors font-medium"><i className="fas fa-sign-out-alt w-6"></i> Logout</button>
                    </div>

                    {/* Main Content Area */}
                    <div className="flex-1 p-8 overflow-y-auto h-screen">
                        <div className="max-w-5xl mx-auto pb-20">
                            
                            {/* --- ANALYTICS TAB --- */}
                            {activeTab === 'analytics' && (
                                <div className="animate-fade-in">
                                    <div className="flex justify-between items-center mb-8">
                                        <h1 className="text-3xl font-bold font-serif text-white">Web Performance & Statistics</h1>
                                        <div className="text-sm text-gray-400 bg-gray-900 px-4 py-2 rounded-lg border border-gray-800">
                                            <i className="fas fa-circle text-green-500 text-[10px] mr-2 animate-pulse"></i> Live Data
                                        </div>
                                    </div>
                                    
                                    {/* Top Stat Cards */}
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                                        <div className="bg-gradient-to-br from-blue-900/40 to-gray-900 border border-blue-900/50 p-6 rounded-2xl shadow-lg">
                                            <p className="text-blue-400 text-sm font-bold uppercase tracking-wider mb-2">Total Page Views</p>
                                            <h3 className="text-4xl font-bold text-white mb-2">{settings.views_count.toLocaleString()}</h3>
                                            <p className="text-xs text-gray-400"><i className="fas fa-arrow-up text-green-400 mr-1"></i> Lifetime metric</p>
                                        </div>
                                        <div className="bg-gradient-to-br from-emerald-900/40 to-gray-900 border border-emerald-900/50 p-6 rounded-2xl shadow-lg">
                                            <p className="text-emerald-400 text-sm font-bold uppercase tracking-wider mb-2">Total Downloads</p>
                                            <h3 className="text-4xl font-bold text-white mb-2">{settings.downloads_count.toLocaleString()}</h3>
                                            <p className="text-xs text-gray-400"><i className="fas fa-file-pdf mr-1"></i> Research & Books</p>
                                        </div>
                                        <div className="bg-gradient-to-br from-purple-900/40 to-gray-900 border border-purple-900/50 p-6 rounded-2xl shadow-lg">
                                            <p className="text-purple-400 text-sm font-bold uppercase tracking-wider mb-2">Subscribers</p>
                                            <h3 className="text-4xl font-bold text-white mb-2">{subscribers.length}</h3>
                                            <p className="text-xs text-gray-400"><i className="fas fa-users mr-1"></i> Active audience</p>
                                        </div>
                                        <div className="bg-gradient-to-br from-orange-900/40 to-gray-900 border border-orange-900/50 p-6 rounded-2xl shadow-lg">
                                            <p className="text-orange-400 text-sm font-bold uppercase tracking-wider mb-2">Publications</p>
                                            <h3 className="text-4xl font-bold text-white mb-2">{publications.length}</h3>
                                            <p className="text-xs text-gray-400"><i className="fas fa-book mr-1"></i> Live on site</p>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                                        {/* Estimated Growth Rates */}
                                        <div className="bg-gray-900 rounded-2xl border border-gray-800 p-6 shadow-lg">
                                            <h3 className="text-lg font-bold text-white mb-6 border-b border-gray-800 pb-2"><i className="fas fa-chart-pie mr-2 text-blue-400"></i> Estimated Traffic Distribution</h3>
                                            <div className="space-y-6">
                                                <div>
                                                    <div className="flex justify-between text-sm mb-2"><span className="text-gray-400">Estimated Daily Visitors</span><span className="text-white font-bold">~{Math.max(1, Math.floor(settings.views_count / 365))}</span></div>
                                                    <div className="w-full bg-gray-800 rounded-full h-2"><div className="bg-blue-500 h-2 rounded-full" style={{width: '15%'}}></div></div>
                                                </div>
                                                <div>
                                                    <div className="flex justify-between text-sm mb-2"><span className="text-gray-400">Estimated Monthly Visitors</span><span className="text-white font-bold">~{Math.max(1, Math.floor(settings.views_count / 12))}</span></div>
                                                    <div className="w-full bg-gray-800 rounded-full h-2"><div className="bg-emerald-500 h-2 rounded-full" style={{width: '45%'}}></div></div>
                                                </div>
                                                <div>
                                                    <div className="flex justify-between text-sm mb-2"><span className="text-gray-400">Yearly Visitors (YTD)</span><span className="text-white font-bold">{settings.views_count}</span></div>
                                                    <div className="w-full bg-gray-800 rounded-full h-2"><div className="bg-purple-500 h-2 rounded-full" style={{width: '85%'}}></div></div>
                                                </div>
                                            </div>
                                            <p className="text-xs text-gray-500 mt-6 italic">Note: These metrics are calculated estimates based on your lifetime database hits.</p>
                                        </div>

                                        {/* Content Breakdown */}
                                        <div className="bg-gray-900 rounded-2xl border border-gray-800 p-6 shadow-lg">
                                            <h3 className="text-lg font-bold text-white mb-6 border-b border-gray-800 pb-2"><i className="fas fa-layer-group mr-2 text-emerald-400"></i> Database Content Spread</h3>
                                            <div className="flex h-40 items-end space-x-2">
                                                {['blog', 'journal', 'research', 'book', 'teaching'].map((type, i) => {
                                                    const count = publications.filter(p => p.type === type).length;
                                                    const height = publications.length > 0 ? Math.max(10, (count / publications.length) * 100) : 0;
                                                    const colors = ['bg-blue-500', 'bg-emerald-500', 'bg-purple-500', 'bg-orange-500', 'bg-pink-500'];
                                                    return (
                                                        <div key={type} className="flex-1 flex flex-col items-center justify-end group">
                                                            <div className="opacity-0 group-hover:opacity-100 text-white text-xs mb-2 transition-opacity">{count}</div>
                                                            <div className={`w-full ${colors[i]} rounded-t-md transition-all duration-500 hover:opacity-80`} style={{height: `${height}%`}}></div>
                                                            <div className="text-[10px] text-gray-500 mt-2 uppercase font-bold transform -rotate-45 origin-top-left mt-4">{type}</div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* --- CMS TAB --- */}
                            {activeTab === 'cms' && (
                                <div className="animate-fade-in">
                                    <h1 className="text-2xl font-bold font-serif text-white mb-6">Content Management</h1>
                                    
                                    {statusMsg.text && (
                                        <div className={`p-4 mb-6 rounded-xl font-medium ${statusMsg.type === 'error' ? 'bg-red-900/50 text-red-400 border border-red-800' : 'bg-emerald-900/50 text-emerald-400 border border-emerald-800'}`}>
                                            {statusMsg.text}
                                        </div>
                                    )}

                                    {/* Create / Edit Form */}
                                    <form onSubmit={handlePublish} className="bg-gray-900 rounded-2xl border border-gray-800 p-6 mb-12 shadow-lg">
                                        <div className="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
                                            <h3 className="text-xl font-bold text-white"><i className="fas fa-pen-nib mr-2 text-emerald-500"></i> {editingId ? 'Editing Publication' : 'Create New Content'}</h3>
                                            {editingId && <button type="button" onClick={cancelEdit} className="text-gray-400 hover:text-white text-sm bg-gray-800 px-3 py-1 rounded-lg">Cancel Edit</button>}
                                        </div>
                                        
                                        <div className="space-y-4">
                                            <div>
                                                <label className="text-xs text-gray-400 mb-1 block">Title</label>
                                                <input required type="text" placeholder="Enter title..." value={title} onChange={e=>setTitle(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white focus:ring-2 focus:ring-emerald-500" />
                                            </div>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <label className="text-xs text-gray-400 mb-1 block">Content Type</label>
                                                    <select value={type} onChange={e=>setType(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white focus:ring-2 focus:ring-emerald-500">
                                                        <option value="blog">Blog Post</option><option value="journal">Journal Entry</option><option value="research">Research Paper</option><option value="book">Book/eBook</option><option value="project">Project</option><option value="teaching">Teaching Material</option>
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="text-xs text-gray-400 mb-1 block">Category Label</label>
                                                    <input type="text" placeholder="e.g. Microbiology, PGPR..." value={category} onChange={e=>setCategory(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white focus:ring-2 focus:ring-emerald-500" />
                                                </div>
                                            </div>
                                            <div>
                                                <label className="text-xs text-gray-400 mb-1 block">Short Summary (Shows on cards)</label>
                                                <textarea required rows="2" placeholder="Brief summary..." value={summary} onChange={e=>setSummary(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white focus:ring-2 focus:ring-emerald-500"></textarea>
                                            </div>
                                            <div>
                                                <label className="text-xs text-gray-400 mb-1 block">Full Content / Abstract</label>
                                                <textarea rows="8" placeholder="Write your full article or abstract here..." value={content} onChange={e=>setContent(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white focus:ring-2 focus:ring-emerald-500"></textarea>
                                            </div>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <div>
                                                    <label className="text-xs text-gray-400 mb-1 block">Tags (Comma separated)</label>
                                                    <input type="text" placeholder="Genomics, Soil, Science" value={tags} onChange={e=>setTags(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white focus:ring-2 focus:ring-emerald-500" />
                                                </div>
                                                <div>
                                                    <label className="text-xs text-gray-400 mb-1 block">Attach PDF Document (Optional)</label>
                                                    <input type="file" accept=".pdf,.doc,.docx" onChange={e=>setFile(e.target.files[0])} className="w-full px-4 py-2.5 rounded-xl bg-gray-800 border-none text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-emerald-900/30 file:text-emerald-400 hover:file:bg-emerald-900/50" />
                                                </div>
                                            </div>
                                            <div>
                                                <label className="text-xs text-gray-400 mb-1 block">Upload Cover / Thumbnail Image (Optional)</label>
                                                {thumbnailUrl && <div className="mb-2"><img src={thumbnailUrl} alt="Thumbnail preview" className="h-32 w-auto rounded-lg border border-gray-700 object-cover"/></div>}
                                                <input type="file" accept="image/*" onChange={e=>setThumbnailFile(e.target.files[0])} className="w-full px-4 py-2.5 rounded-xl bg-gray-800 border-none text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-900/30 file:text-blue-400 hover:file:bg-blue-900/50" />
                                                <p className="text-gray-500 text-xs mt-1">Upload a custom image to act as the cover for this specific post/book.</p>
                                            </div>
                                            <button type="submit" disabled={isPublishing} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-4 rounded-xl font-bold transition-colors disabled:opacity-50 mt-4 shadow-lg text-lg">
                                                <i className="fas fa-paper-plane mr-2"></i> {isPublishing ? 'Saving...' : (editingId ? 'Update Publication' : 'Publish to Live Site')}
                                            </button>
                                        </div>
                                    </form>

                                    {/* List View (Edit/Delete) */}
                                    <h3 className="text-xl font-bold font-serif text-white mb-4">Published Content Library</h3>
                                    <div className="bg-gray-900 rounded-2xl border border-gray-800 overflow-hidden shadow-lg">
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left">
                                                <thead className="bg-gray-800 text-gray-400 text-sm">
                                                    <tr>
                                                        <th className="px-6 py-4 font-medium">Title</th>
                                                        <th className="px-6 py-4 font-medium">Type</th>
                                                        <th className="px-6 py-4 font-medium">Date</th>
                                                        <th className="px-6 py-4 font-medium text-right">Actions</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-gray-800">
                                                    {publications.length === 0 ? (
                                                        <tr><td colSpan="4" className="px-6 py-8 text-center text-gray-500">No content published yet.</td></tr>
                                                    ) : publications.map(p => (
                                                        <tr key={p.id} className="hover:bg-gray-800/50 transition-colors">
                                                            <td className="px-6 py-4 font-medium text-white">{p.title}</td>
                                                            <td className="px-6 py-4 text-emerald-400 text-xs uppercase font-bold tracking-wider">{p.type}</td>
                                                            <td className="px-6 py-4 text-gray-400 text-sm">{p.published_date}</td>
                                                            <td className="px-6 py-4 text-right space-x-3">
                                                                <button onClick={() => handleEdit(p)} className="text-blue-400 hover:text-blue-300 font-medium text-sm transition-colors bg-blue-900/20 px-3 py-1 rounded">Edit</button>
                                                                <button onClick={() => handleDelete(p.id, p.title)} className="text-red-400 hover:text-red-300 font-medium text-sm transition-colors bg-red-900/20 px-3 py-1 rounded">Delete</button>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* --- SETTINGS TAB (Edit Everything) --- */}
                            {activeTab === 'settings' && (
                                <div className="animate-fade-in">
                                    <div className="flex justify-between items-center mb-6">
                                        <h1 className="text-2xl font-bold font-serif text-white">Web Settings & Profile</h1>
                                    </div>
                                    
                                    {settingsStatus.text && (
                                        <div className={`p-4 mb-6 rounded-xl font-medium ${settingsStatus.type === 'error' ? 'bg-red-900/50 text-red-400 border border-red-800' : 'bg-emerald-900/50 text-emerald-400 border border-emerald-800'}`}>
                                            {settingsStatus.text}
                                        </div>
                                    )}

                                    <form onSubmit={handleSettingsUpdate} className="space-y-6">
                                        {/* Basic Info */}
                                        <div className="bg-gray-900 rounded-2xl border border-gray-800 p-6 shadow-lg">
                                            <h3 className="text-lg font-bold text-white mb-4 border-b border-gray-800 pb-2">Basic Info & Images</h3>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                <div><label className="text-xs text-gray-400 mb-1 block">Display Name</label><input type="text" value={settings.display_name || ''} onChange={e=>setSettings({...settings, display_name: e.target.value})} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white focus:ring-2 focus:ring-emerald-500" /></div>
                                                <div><label className="text-xs text-gray-400 mb-1 block">Short Bio (Headline)</label><input type="text" value={settings.bio || ''} onChange={e=>setSettings({...settings, bio: e.target.value})} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white focus:ring-2 focus:ring-emerald-500" /></div>
                                                <div>
                                                    <label className="text-xs text-gray-400 mb-1 block">Profile Picture (Crops automatically to fit)</label>
                                                    <div className="flex items-center gap-4">
                                                        {settings.profile_pic_url && <img src={settings.profile_pic_url} className="w-16 h-16 rounded-2xl object-cover object-center border border-gray-700 shadow-md" alt="Profile" />}
                                                        <input type="file" accept="image/*" onChange={e=>handleImageUpload(e, 'profile_pic_url')} className="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-emerald-900/30 file:text-emerald-400 hover:file:bg-emerald-900/50" />
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Website Text Content */}
                                        <div className="bg-gray-900 rounded-2xl border border-gray-800 p-6 shadow-lg">
                                            <h3 className="text-lg font-bold text-white mb-4 border-b border-gray-800 pb-2">Website Text Content</h3>
                                            <div className="space-y-4">
                                                <div><label className="text-xs text-gray-400 mb-1 block">Homepage Hero Title</label><input type="text" value={settings.hero_title || ''} onChange={e=>setSettings({...settings, hero_title: e.target.value})} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white focus:ring-2 focus:ring-emerald-500" placeholder="e.g. Knowledge that grows..." /></div>
                                                <div><label className="text-xs text-gray-400 mb-1 block">Homepage Hero Subtitle</label><input type="text" value={settings.hero_subtitle || ''} onChange={e=>setSettings({...settings, hero_subtitle: e.target.value})} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white focus:ring-2 focus:ring-emerald-500" placeholder="e.g. Welcome to my digital knowledge hub..." /></div>
                                                <div><label className="text-xs text-gray-400 mb-1 block">Mission Statement</label><textarea rows="3" value={settings.mission_text || ''} onChange={e=>setSettings({...settings, mission_text: e.target.value})} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white focus:ring-2 focus:ring-emerald-500"></textarea></div>
                                                <div><label className="text-xs text-gray-400 mb-1 block">About Me (Full Text)</label><textarea rows="6" value={settings.about_text || ''} onChange={e=>setSettings({...settings, about_text: e.target.value})} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white focus:ring-2 focus:ring-emerald-500"></textarea></div>
                                                <div><label className="text-xs text-gray-400 mb-1 block">Footer Text</label><input type="text" value={settings.footer_text || ''} onChange={e=>setSettings({...settings, footer_text: e.target.value})} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white focus:ring-2 focus:ring-emerald-500" placeholder="e.g. Built with love..." /></div>
                                            </div>
                                        </div>

                                        {/* Dynamic Quotes Section */}
                                        <div className="bg-gray-900 rounded-2xl border border-gray-800 p-6 shadow-lg">
                                            <div className="flex justify-between items-center mb-4 border-b border-gray-800 pb-2">
                                                <h3 className="text-lg font-bold text-white">Quote of the Day</h3>
                                                <button type="button" onClick={handleGenerateQuote} className="px-4 py-2 bg-blue-900/30 text-blue-400 hover:bg-blue-900/50 rounded-lg text-sm font-bold transition-colors shadow-sm">
                                                    <i className="fas fa-magic mr-2"></i> Generate Random Quote
                                                </button>
                                            </div>
                                            <div className="space-y-4">
                                                <div><label className="text-xs text-gray-400 mb-1 block">Inspiring Quote Text</label><textarea rows="2" value={settings.daily_quote || ''} onChange={e=>setSettings({...settings, daily_quote: e.target.value})} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white focus:ring-2 focus:ring-emerald-500" placeholder="Type a quote or generate one..."></textarea></div>
                                                <div><label className="text-xs text-gray-400 mb-1 block">Quote Author</label><input type="text" value={settings.quote_author || ''} onChange={e=>setSettings({...settings, quote_author: e.target.value})} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white focus:ring-2 focus:ring-emerald-500" placeholder="Who said it?" /></div>
                                            </div>
                                        </div>

                                        {/* Social Links */}
                                        <div className="bg-gray-900 rounded-2xl border border-gray-800 p-6 shadow-lg">
                                            <h3 className="text-lg font-bold text-white mb-4 border-b border-gray-800 pb-2">Social & Connect Links</h3>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <div><label className="text-xs text-gray-400 mb-1 block"><i className="fab fa-linkedin text-blue-500"></i> LinkedIn URL</label><input type="url" placeholder="https://linkedin.com/in/..." value={settings.linkedin_url || ''} onChange={e=>setSettings({...settings, linkedin_url: e.target.value})} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white focus:ring-2 focus:ring-emerald-500" /></div>
                                                <div><label className="text-xs text-gray-400 mb-1 block"><i className="fab fa-twitter text-sky-500"></i> Twitter/X URL</label><input type="url" placeholder="https://twitter.com/..." value={settings.twitter_url || ''} onChange={e=>setSettings({...settings, twitter_url: e.target.value})} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white focus:ring-2 focus:ring-emerald-500" /></div>
                                                <div><label className="text-xs text-gray-400 mb-1 block"><i className="fab fa-youtube text-red-500"></i> YouTube Channel URL</label><input type="url" placeholder="https://youtube.com/..." value={settings.youtube_url || ''} onChange={e=>setSettings({...settings, youtube_url: e.target.value})} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white focus:ring-2 focus:ring-emerald-500" /></div>
                                                <div><label className="text-xs text-gray-400 mb-1 block"><i className="fab fa-orcid text-green-500"></i> ORCID Profile URL</label><input type="url" placeholder="https://orcid.org/..." value={settings.orcid_url || ''} onChange={e=>setSettings({...settings, orcid_url: e.target.value})} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white focus:ring-2 focus:ring-emerald-500" /></div>
                                                <div><label className="text-xs text-gray-400 mb-1 block"><i className="fab fa-facebook text-blue-600"></i> Facebook URL</label><input type="url" placeholder="https://facebook.com/..." value={settings.facebook_url || ''} onChange={e=>setSettings({...settings, facebook_url: e.target.value})} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white focus:ring-2 focus:ring-emerald-500" /></div>
                                                <div><label className="text-xs text-gray-400 mb-1 block"><i className="fab fa-whatsapp text-green-500"></i> WhatsApp Number (inc. country code)</label><input type="text" placeholder="e.g. 2348012345678" value={settings.whatsapp_number || ''} onChange={e=>setSettings({...settings, whatsapp_number: e.target.value})} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white focus:ring-2 focus:ring-emerald-500" /></div>
                                            </div>
                                        </div>

                                        <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-xl font-bold text-lg shadow-lg transition-colors">
                                            <i className="fas fa-save mr-2"></i> Save All Settings
                                        </button>
                                    </form>
                                </div>
                            )}

                            {/* --- INBOX TAB --- */}
                            {activeTab === 'inbox' && (
                                <div className="animate-fade-in">
                                    <h1 className="text-3xl font-bold font-serif text-white mb-8">Contact Inbox</h1>
                                    <div className="space-y-4">
                                        {messages.length === 0 ? (
                                            <div className="bg-gray-900 p-12 rounded-2xl border border-gray-800 text-center">
                                                <i className="fas fa-inbox text-4xl text-gray-600 mb-4"></i>
                                                <p className="text-gray-400 text-lg">No messages yet.</p>
                                            </div>
                                        ) : messages.map(m => (
                                            <div key={m.id} className="bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-lg hover:border-emerald-900/50 transition-colors">
                                                <div className="flex justify-between items-start mb-4 border-b border-gray-800 pb-4">
                                                    <div>
                                                        <h4 className="text-white font-bold text-xl">{m.name}</h4>
                                                        <a href={`mailto:${m.email}`} className="text-emerald-400 text-sm hover:underline"><i className="fas fa-envelope mr-1"></i> {m.email}</a>
                                                    </div>
                                                    <span className="text-xs text-gray-500 bg-gray-800 px-3 py-1 rounded-full border border-gray-700">{new Date(m.created_at).toLocaleDateString()}</span>
                                                </div>
                                                <p className="text-gray-300 leading-relaxed whitespace-pre-wrap text-lg mb-6">{m.message}</p>
                                                
                                                <div className="flex justify-end">
                                                    {/* Intelligent Email Reply Button */}
                                                    <a href={`mailto:${m.email}?subject=Re: Your message to Ajayi Knowledge Hub&body=%0D%0A%0D%0A---%0D%0AOn ${new Date(m.created_at).toLocaleDateString()}, ${m.name} wrote:%0D%0A${encodeURIComponent(m.message)}`} 
                                                       className="inline-flex items-center gap-2 px-5 py-2.5 bg-blue-900/30 text-blue-400 hover:bg-blue-900/50 border border-blue-900/50 rounded-xl text-sm font-bold transition-colors shadow-sm">
                                                        <i className="fas fa-reply"></i> Reply via Email
                                                    </a>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* --- SUBSCRIBERS TAB --- */}
                            {activeTab === 'subscribers' && (
                                <div className="animate-fade-in">
                                    <div className="flex justify-between items-center mb-8">
                                        <h1 className="text-3xl font-bold font-serif text-white">Newsletter Subscribers</h1>
                                        <div className="bg-emerald-900/30 text-emerald-400 px-5 py-2 rounded-xl font-bold border border-emerald-800/50 shadow-sm">
                                            Total Audience: {subscribers.length}
                                        </div>
                                    </div>
                                    <div className="bg-gray-900 rounded-2xl border border-gray-800 p-6 shadow-lg">
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            {subscribers.length === 0 ? (
                                                <div className="col-span-2 text-center text-gray-500 py-8">No subscribers yet. Keep creating great content!</div>
                                            ) : subscribers.map(s => (
                                                <div key={s.id} className="flex justify-between items-center p-4 bg-gray-800 rounded-xl border border-gray-700">
                                                    <span className="text-white font-medium"><i className="fas fa-user-circle text-gray-500 mr-2"></i> {s.email}</span>
                                                    <span className="text-xs text-gray-500">{new Date(s.created_at).toLocaleDateString()}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [session, setSession] = useState(null);
            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => setSession(session));
                supabase.auth.onAuthStateChange((_event, session) => setSession(session));
            }, []);

            if (!session) return (
                <div className="min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-gray-950">
                    <div className="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1532094349884-543bc11b234d?auto=format&fit=crop&q=80')] bg-cover opacity-10"></div>
                    <form onSubmit={async (e) => { e.preventDefault(); await supabase.auth.signInWithPassword({ email: e.target.email.value, password: e.target.password.value }); }} className="bg-gray-900/90 backdrop-blur-xl p-10 rounded-3xl w-full max-w-md space-y-6 border border-gray-800 shadow-2xl relative z-10">
                        <div className="text-center mb-8">
                            <div className="w-16 h-16 bg-gradient-to-br from-[#0B1F3A] to-[#2E8B57] rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-lg">
                                <i className="fas fa-lock text-white text-2xl"></i>
                            </div>
                            <h2 className="text-3xl font-bold font-serif text-white">Admin Access</h2>
                            <p className="text-gray-400 mt-2 text-sm">Secure login to Knowledge Hub</p>
                        </div>
                        <div className="space-y-4">
                            <input name="email" type="email" placeholder="Admin Email" required className="w-full px-5 py-4 rounded-xl bg-gray-800 border-none text-white focus:ring-2 focus:ring-[#2E8B57] transition-all" />
                            <input name="password" type="password" placeholder="Password" required className="w-full px-5 py-4 rounded-xl bg-gray-800 border-none text-white focus:ring-2 focus:ring-[#2E8B57] transition-all" />
                        </div>
                        <button type="submit" className="w-full bg-[#2E8B57] hover:bg-[#257348] text-white py-4 rounded-xl font-bold text-lg shadow-lg transition-colors mt-8">Login to Dashboard</button>
                    </form>
                </div>
            );
            return <AdminDashboardView onLogout={() => supabase.auth.signOut()} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
