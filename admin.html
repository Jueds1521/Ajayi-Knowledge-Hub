<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Ajayi Knowledge Hub</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { navy: '#0B1F3A', 'emerald-custom': '#2E8B57', gold: '#D4AF37' },
                    fontFamily: { serif: ['Merriweather', 'serif'], sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { background-color: #0a0a0a; color: #F9FAFB; font-family: 'Inter', sans-serif; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const supabaseUrl = 'https://ulqihwnzujncqpexersp.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVscWlod256dWpuY3FwZXhlcnNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNDIxNjMsImV4cCI6MjEwMDgxODE2M30.vvMQLeUtjVmciJxwqVgiFVZjmHlclY0Z-oHngY3SVso';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const LoginScreen = ({ onLoginSuccess }) => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [errorMsg, setErrorMsg] = useState(null);

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setErrorMsg(null);
                
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    setErrorMsg(error.message);
                    setLoading(false);
                } else {
                    onLoginSuccess(data.session);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 animate-fade-in relative overflow-hidden">
                    <div className="absolute top-[-10%] left-[-10%] w-96 h-96 bg-emerald-900/20 rounded-full blur-3xl pointer-events-none"></div>
                    <div className="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-navy rounded-full blur-3xl pointer-events-none"></div>

                    <div className="bg-gray-900 border border-gray-800 p-8 rounded-3xl shadow-2xl w-full max-w-md relative z-10">
                        <div className="text-center mb-8">
                            <div className="w-16 h-16 rounded-2xl bg-gradient-to-br from-navy to-emerald-custom flex items-center justify-center shadow-lg mx-auto mb-4">
                                <span className="text-white font-serif font-bold text-3xl">A</span>
                            </div>
                            <h2 className="text-2xl font-bold font-serif text-white">Admin Portal</h2>
                            <p className="text-gray-400 text-sm mt-2">Sign in to manage the Knowledge Hub</p>
                        </div>

                        {errorMsg && (
                            <div className="mb-6 p-4 bg-red-900/30 border border-red-800 rounded-xl text-red-200 text-sm flex items-start">
                                <i className="fas fa-exclamation-circle mt-1 mr-2"></i>
                                {errorMsg}
                            </div>
                        )}

                        <form onSubmit={handleLogin} className="space-y-5">
                            <div>
                                <label className="block text-sm font-medium text-gray-300 mb-1">Email Address</label>
                                <input 
                                    type="email" 
                                    required
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    className="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-emerald-custom text-white" 
                                    placeholder="admin@example.com"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-300 mb-1">Password</label>
                                <input 
                                    type="password" 
                                    required
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    className="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-emerald-custom text-white" 
                                    placeholder="••••••••"
                                />
                            </div>
                            <button 
                                type="submit" 
                                disabled={loading}
                                className={`w-full bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3.5 rounded-xl font-medium transition-all shadow-md flex justify-center items-center ${loading ? 'opacity-70 cursor-not-allowed' : ''}`}
                            >
                                {loading ? <i className="fas fa-spinner fa-spin mr-2"></i> : <i className="fas fa-lock mr-2"></i>}
                                {loading ? 'Authenticating...' : 'Sign In'}
                            </button>
                        </form>
                        
                        <div className="mt-6 text-center">
                            <a href="/index.html" className="text-sm text-gray-500 hover:text-emerald-400 transition-colors">
                                <i className="fas fa-arrow-left mr-1"></i> Return to main website
                            </a>
                        </div>
                    </div>
                </div>
            );
        };

        const AdminDashboardView = ({ onLogout }) => {
            // Form States
            const [title, setTitle] = useState('');
            const [type, setType] = useState('blog');
            const [category, setCategory] = useState('');
            const [summary, setSummary] = useState('');
            const [content, setContent] = useState('');
            const [tags, setTags] = useState('');
            const [file, setFile] = useState(null);
            
            // App States
            const [activeTab, setActiveTab] = useState('dashboard');
            const [publications, setPublications] = useState([]);
            const [isPublishing, setIsPublishing] = useState(false);
            const [isLoadingPosts, setIsLoadingPosts] = useState(true);
            const [statusMsg, setStatusMsg] = useState({ type: '', text: '' });
            const [editingId, setEditingId] = useState(null); 
            const [deletingId, setDeletingId] = useState(null); 

            const fetchPublications = async () => {
                setIsLoadingPosts(true);
                try {
                    const { data, error } = await supabase
                        .from('publications')
                        .select('*')
                        .order('id', { ascending: false });
                    
                    if (error) throw error;
                    if (data) setPublications(data);
                } catch (err) {
                    console.error("Error fetching data:", err);
                } finally {
                    setIsLoadingPosts(false);
                }
            };

            useEffect(() => {
                fetchPublications();
            }, []);

            const handlePublish = async (e) => {
                e.preventDefault();
                setIsPublishing(true);
                setStatusMsg({ type: '', text: '' });

                const tagsArray = tags.split(',').map(tag => tag.trim()).filter(tag => tag !== '');
                
                try {
                    let fileUrl = null;
                    // Handle PDF Upload to Supabase Storage if a file was selected
                    if (file) {
                        const fileExt = file.name.split('.').pop();
                        const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
                        
                        const { error: uploadError } = await supabase.storage
                            .from('documents')
                            .upload(fileName, file);
                            
                        if (uploadError) throw uploadError;
                        
                        const { data } = supabase.storage
                            .from('documents')
                            .getPublicUrl(fileName);
                            
                        fileUrl = data.publicUrl;
                    }

                    const payload = {
                        title: title,
                        type: type,
                        category: category,
                        summary: summary,
                        content: content,
                        tags: tagsArray
                    };

                    // Only update the file URL if a new file was uploaded
                    if (fileUrl) {
                        payload.file_url = fileUrl;
                    }

                    if (editingId) {
                        // UPDATE EXISTING POST
                        const { error } = await supabase.from('publications').update(payload).eq('id', editingId);
                        if (error) throw error;
                        
                        setStatusMsg({ type: 'success', text: 'Successfully updated your publication!' });
                        clearForm();
                        fetchPublications();
                    } else {
                        // CREATE NEW POST
                        const dateOptions = { year: 'numeric', month: 'short', day: 'numeric' };
                        const publishedDate = new Date().toLocaleDateString('en-US', dateOptions);

                        payload.published_date = publishedDate;

                        const { error } = await supabase.from('publications').insert([payload]);
                        if (error) throw error;

                        setStatusMsg({ type: 'success', text: 'Successfully published to your Knowledge Hub!' });
                        clearForm();
                        fetchPublications();
                    }
                } catch (error) {
                    setStatusMsg({ type: 'error', text: error.message });
                } finally {
                    setIsPublishing(false);
                    setTimeout(() => setStatusMsg({ type: '', text: '' }), 5000);
                }
            };

            const handleEditClick = (pub) => {
                setEditingId(pub.id);
                setTitle(pub.title || '');
                setType(pub.type || 'blog');
                setCategory(pub.category || '');
                setSummary(pub.summary || '');
                setContent(pub.content || '');
                const safeTags = Array.isArray(pub.tags) ? pub.tags.join(', ') : (pub.tags || '');
                setTags(safeTags);
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
                setStatusMsg({ type: 'success', text: `Editing: ${pub.title}` });
            };

            const confirmDelete = async (id) => {
                try {
                    const { error } = await supabase.from('publications').delete().eq('id', id);
                    if (error) throw error;
                    
                    setDeletingId(null);
                    fetchPublications();
                    setStatusMsg({ type: 'success', text: 'Publication deleted successfully.' });
                    setTimeout(() => setStatusMsg({ type: '', text: '' }), 4000);
                } catch (error) {
                    setStatusMsg({ type: 'error', text: error.message });
                }
            };

            const clearForm = () => {
                setEditingId(null);
                setTitle(''); setCategory(''); setSummary(''); setContent(''); setTags(''); setFile(null);
            };

            return (
                <div className="min-h-screen bg-[#0a0a0a] flex animate-fade-in">
                    {/* Sidebar */}
                    <div className="w-64 bg-gray-900 border-r border-gray-800 hidden md:flex flex-col">
                        <div className="p-6 border-b border-gray-800">
                            <div className="flex items-center space-x-2">
                                <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-navy to-emerald-custom flex items-center justify-center">
                                    <span className="text-white font-serif font-bold text-sm">A</span>
                                </div>
                                <span className="font-serif font-bold text-lg text-white">Ajayi Hub</span>
                            </div>
                        </div>
                        <div className="p-4 flex-1">
                            <h3 className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-4 px-2">Menu</h3>
                            <nav className="space-y-1">
                                <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-colors ${activeTab === 'dashboard' ? 'bg-emerald-900/20 text-emerald-400' : 'text-gray-400 hover:bg-gray-800'}`}>
                                    <i className="fas fa-chart-line mr-3"></i> Dashboard
                                </button>
                                <button onClick={() => setActiveTab('settings')} className={`w-full flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-colors ${activeTab === 'settings' ? 'bg-emerald-900/20 text-emerald-400' : 'text-gray-400 hover:bg-gray-800'}`}>
                                    <i className="fas fa-cog mr-3"></i> Settings
                                </button>
                            </nav>
                        </div>
                        <div className="p-4 border-t border-gray-800">
                            <button onClick={onLogout} className="w-full flex items-center px-4 py-3 text-sm font-medium rounded-xl text-red-400 hover:bg-red-900/20 transition-colors">
                                <i className="fas fa-sign-out-alt mr-3"></i> Sign Out
                            </button>
                        </div>
                    </div>

                    {/* Main Content Area */}
                    <div className="flex-1 p-8 overflow-y-auto">
                        <div className="max-w-5xl mx-auto">
                            
                            {}
                            {activeTab === 'settings' ? (
                                <div className="animate-fade-in">
                                    <div className="flex justify-between items-center mb-8">
                                        <h1 className="text-2xl font-bold font-serif text-white">Platform Settings</h1>
                                    </div>
                                    <div className="bg-gray-900 rounded-2xl border border-gray-800 shadow-xl p-8 mb-6">
                                        <h3 className="text-lg font-bold text-white mb-4"><i className="fas fa-user-circle text-emerald-500 mr-2"></i> Administrator Profile</h3>
                                        <p className="text-gray-400 mb-6 text-sm">Update your public profile and knowledge hub settings.</p>
                                        
                                        <div className="space-y-5 max-w-lg">
                                            <div>
                                                <label className="block text-sm font-medium text-gray-300 mb-1">Display Name</label>
                                                <input type="text" defaultValue="Paul Olakiitan Ajayi" className="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-emerald-custom text-white" />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-gray-300 mb-1">Contact Email</label>
                                                <input type="email" defaultValue="admin@ajayihub.com" className="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-emerald-custom text-white" />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-gray-300 mb-1">Short Bio</label>
                                                <textarea rows="3" className="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-emerald-custom text-white resize-none" defaultValue="Microbiologist · Researcher · Educator"></textarea>
                                            </div>
                                            <button className="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl font-medium transition-all shadow-md">
                                                Save Settings
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="animate-fade-in">
                                    <div className="flex justify-between items-center mb-8">
                                        <h1 className="text-2xl font-bold font-serif text-white">Command Center</h1>
                                    </div>
                                    
                                    {}
                                    <div className="bg-gray-900 rounded-2xl border border-gray-800 shadow-xl overflow-hidden mb-12">
                                        <div className="p-6 border-b border-gray-800 bg-gray-900/50 flex justify-between items-center">
                                            <h3 className="text-lg font-bold text-white flex items-center">
                                                <i className="fas fa-edit text-emerald-500 mr-2"></i> 
                                                {editingId ? 'Edit Publication' : 'Create New Publication'}
                                            </h3>
                                            {editingId && (
                                                <button onClick={clearForm} type="button" className="text-sm text-gray-400 hover:text-white transition-colors">
                                                    Cancel Edit
                                                </button>
                                            )}
                                        </div>
                                        
                                        {statusMsg.text && (
                                            <div className={`p-4 m-6 mb-0 rounded-xl flex items-start text-sm ${statusMsg.type === 'error' ? 'bg-red-900/30 border border-red-800 text-red-200' : 'bg-emerald-900/30 border border-emerald-800 text-emerald-200'}`}>
                                                <i className={`fas ${statusMsg.type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'} mt-1 mr-2`}></i>
                                                {statusMsg.text}
                                            </div>
                                        )}

                                        <form onSubmit={handlePublish} className="p-6 space-y-6">
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                <div>
                                                    <label className="block text-sm font-medium text-gray-300 mb-1">Publication Title</label>
                                                    <input type="text" required value={title} onChange={(e) => setTitle(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-emerald-custom text-white" placeholder="Enter title..." />
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-medium text-gray-300 mb-1">Content Type</label>
                                                    <select value={type} onChange={(e) => setType(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-emerald-custom text-white appearance-none">
                                                        <option value="blog">Blog Post</option>
                                                        <option value="journal">Journal Entry</option>
                                                        <option value="research">Research Paper</option>
                                                        <option value="book">Book</option>
                                                        <option value="teaching">Teaching Material</option>
                                                        <option value="project">Project</option>
                                                    </select>
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                <div>
                                                    <label className="block text-sm font-medium text-gray-300 mb-1">Category</label>
                                                    <input type="text" value={category} onChange={(e) => setCategory(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-emerald-custom text-white" placeholder="Microbial Genomics" />
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-medium text-gray-300 mb-1">Tags (comma separated)</label>
                                                    <input type="text" value={tags} onChange={(e) => setTags(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-emerald-custom text-white" placeholder="Soil, PGPR, Bacteria" />
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-sm font-medium text-gray-300 mb-1">Abstract / Summary</label>
                                                <textarea required rows="2" value={summary} onChange={(e) => setSummary(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-emerald-custom text-white resize-none" placeholder="A brief summary of the publication..."></textarea>
                                            </div>

                                            <div>
                                                <label className="block text-sm font-medium text-gray-300 mb-1">Full Content (Optional for PDFs)</label>
                                                <textarea rows="6" value={content} onChange={(e) => setContent(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-emerald-custom text-white resize-none font-serif" placeholder="Write your full article here..."></textarea>
                                            </div>

                                            <div>
                                                <label className="block text-sm font-medium text-gray-300 mb-1">Attach PDF Document (Optional)</label>
                                                <div className="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-700 border-dashed rounded-xl bg-gray-800/50 hover:bg-gray-800 transition-colors">
                                                    <div className="space-y-1 text-center">
                                                        <i className="fas fa-file-pdf text-gray-400 text-3xl mb-3"></i>
                                                        <div className="flex text-sm text-gray-400 justify-center">
                                                            <label htmlFor="file-upload" className="relative cursor-pointer bg-gray-900 rounded-md font-medium text-emerald-500 hover:text-emerald-400 focus-within:outline-none px-2 py-1">
                                                                <span>Upload a file</span>
                                                                <input id="file-upload" name="file-upload" type="file" className="sr-only" onChange={(e) => setFile(e.target.files[0])} accept=".pdf" />
                                                            </label>
                                                            <p className="pl-1 pt-1">or drag and drop</p>
                                                        </div>
                                                        <p className="text-xs text-gray-500">PDF up to 10MB</p>
                                                        {file && <p className="text-emerald-400 text-sm mt-2 font-medium"><i className="fas fa-check-circle mr-1"></i> {file.name}</p>}
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="pt-4 border-t border-gray-800 flex justify-end">
                                                <button type="submit" disabled={isPublishing} className={`bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-3 rounded-xl font-medium transition-all shadow-md flex items-center ${isPublishing ? 'opacity-70 cursor-not-allowed' : ''}`}>
                                                    {isPublishing ? <i className="fas fa-spinner fa-spin mr-2"></i> : <i className="fas fa-paper-plane mr-2"></i>}
                                                    {isPublishing ? 'Saving...' : (editingId ? 'Update Publication' : 'Publish to Live Site')}
                                                </button>
                                            </div>
                                        </form>
                                    </div>

                                    {}
                                    <div className="bg-gray-900 rounded-2xl border border-gray-800 shadow-xl overflow-hidden">
                                        <div className="p-6 border-b border-gray-800 bg-gray-900/50 flex justify-between items-center">
                                            <h3 className="text-lg font-bold text-white flex items-center">
                                                <i className="fas fa-layer-group text-emerald-500 mr-2"></i> Manage Content
                                            </h3>
                                            <button onClick={fetchPublications} type="button" className="text-gray-400 hover:text-white transition-colors" title="Refresh List">
                                                <i className="fas fa-sync-alt"></i>
                                            </button>
                                        </div>
                                        <div className="overflow-x-auto">
                                            {isLoadingPosts ? (
                                                <div className="p-12 text-center text-gray-500">
                                                    <i className="fas fa-spinner fa-spin text-2xl mb-3 text-emerald-500"></i>
                                                    <p>Loading your publications...</p>
                                                </div>
                                            ) : publications.length === 0 ? (
                                                <div className="p-12 text-center text-gray-500">
                                                    <i className="fas fa-folder-open text-4xl mb-3 opacity-50"></i>
                                                    <p>No publications found. Start writing above!</p>
                                                </div>
                                            ) : (
                                                <table className="w-full text-left">
                                                    <thead>
                                                        <tr className="bg-gray-800/50 text-gray-400 text-sm border-b border-gray-800">
                                                            <th className="px-6 py-4 font-medium">Title & Category</th>
                                                            <th className="px-6 py-4 font-medium">Type</th>
                                                            <th className="px-6 py-4 font-medium">Date</th>
                                                            <th className="px-6 py-4 font-medium text-right">Actions</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-gray-800">
                                                        {publications.map((pub) => (
                                                            <tr key={pub.id} className="hover:bg-gray-800/30 transition-colors group">
                                                                <td className="px-6 py-4">
                                                                    <div className="flex items-center">
                                                                        {pub.file_url && <i className="fas fa-paperclip text-emerald-500 mr-2" title="Has Attachment"></i>}
                                                                        <div>
                                                                            <p className="font-medium text-white group-hover:text-emerald-400 transition-colors">{pub.title}</p>
                                                                            <p className="text-xs text-gray-500 mt-1">{pub.category || 'Uncategorized'}</p>
                                                                        </div>
                                                                    </div>
                                                                </td>
                                                                <td className="px-6 py-4">
                                                                    <span className="px-2 py-1 bg-gray-800 text-gray-300 text-xs rounded-full font-medium capitalize border border-gray-700">
                                                                        {pub.type}
                                                                    </span>
                                                                </td>
                                                                <td className="px-6 py-4 text-sm text-gray-400">
                                                                    {pub.published_date}
                                                                </td>
                                                                <td className="px-6 py-4 text-right">
                                                                    {deletingId === pub.id ? (
                                                                        <div className="flex justify-end items-center space-x-3 bg-red-900/20 px-3 py-2 rounded-lg border border-red-900/50 inline-flex">
                                                                            <span className="text-xs text-red-200">Are you sure?</span>
                                                                            <button onClick={() => confirmDelete(pub.id)} type="button" className="text-red-400 hover:text-red-300 font-bold text-sm bg-red-900/50 px-2 py-1 rounded">Delete</button>
                                                                            <button onClick={() => setDeletingId(null)} type="button" className="text-gray-400 hover:text-white text-sm">Cancel</button>
                                                                        </div>
                                                                    ) : (
                                                                        <div className="flex justify-end space-x-3 opacity-0 group-hover:opacity-100 transition-opacity">
                                                                            <button onClick={() => handleEditClick(pub)} type="button" className="text-blue-400 hover:text-blue-300 font-medium text-sm transition-colors px-2 py-1"><i className="fas fa-pen"></i> Edit</button>
                                                                            <button onClick={() => setDeletingId(pub.id)} type="button" className="text-red-400 hover:text-red-300 font-medium text-sm transition-colors px-2 py-1"><i className="fas fa-trash"></i> Delete</button>
                                                                        </div>
                                                                    )}
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const AdminApp = () => {
            const [session, setSession] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setSession(session);
                    setLoading(false);
                });

                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
                    setSession(session);
                });

                return () => {
                    if (subscription) subscription.unsubscribe();
                };
            }, []);

            const handleLogout = async () => {
                await supabase.auth.signOut();
            };

            if (loading) return <div className="min-h-screen bg-[#0a0a0a] flex items-center justify-center"><i className="fas fa-spinner fa-spin text-3xl text-emerald-500"></i></div>;
            if (!session) return <LoginScreen onLoginSuccess={setSession} />;
            return <AdminDashboardView onLogout={handleLogout} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminApp />);
    </script>
</body>
</html>
