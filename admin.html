<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Ajayi Knowledge Hub</title>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS & Supabase -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { navy: '#0B1F3A', 'emerald-custom': '#2E8B57' }, fontFamily: { serif: ['Merriweather', 'serif'], sans: ['Inter', 'sans-serif'] } } }
        }
    </script>
    <style>body { background-color: #0a0a0a; color: #F9FAFB; } .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; } @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }</style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const supabaseUrl = 'https://ulqihwnzujncqpexersp.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVscWlod256dWpuY3FwZXhlcnNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNDIxNjMsImV4cCI6MjEwMDgxODE2M30.vvMQLeUtjVmciJxwqVgiFVZjmHlclY0Z-oHngY3SVso';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const AdminDashboardView = ({ onLogout }) => {
            const [activeTab, setActiveTab] = useState('dashboard');
            
            // CMS State
            const [title, setTitle] = useState(''); const [type, setType] = useState('blog'); const [category, setCategory] = useState('');
            const [summary, setSummary] = useState(''); const [content, setContent] = useState(''); const [tags, setTags] = useState('');
            const [file, setFile] = useState(null); const [isPublishing, setIsPublishing] = useState(false); const [editingId, setEditingId] = useState(null);
            
            // Data State
            const [publications, setPublications] = useState([]);
            const [messages, setMessages] = useState([]);
            const [subscribers, setSubscribers] = useState([]);
            const [settings, setSettings] = useState({ display_name: '', bio: '', about_text: '', mission_text: '', profile_pic_url: '', logo_url: '', linkedin_url: '', facebook_url: '', orcid_url: '', whatsapp_number: '', views_count: 0, downloads_count: 0 });
            
            // UI State
            const [statusMsg, setStatusMsg] = useState({ type: '', text: '' });
            const [settingsStatus, setSettingsStatus] = useState('');

            const fetchData = async () => {
                const { data: pubs } = await supabase.from('publications').select('*').order('id', { ascending: false });
                if (pubs) setPublications(pubs);
                
                const { data: msgs } = await supabase.from('messages').select('*').order('created_at', { ascending: false });
                if (msgs) setMessages(msgs);
                
                const { data: subs } = await supabase.from('subscribers').select('*').order('created_at', { ascending: false });
                if (subs) setSubscribers(subs);

                const { data: sets } = await supabase.from('site_settings').select('*').eq('id', 1).single();
                if (sets) setSettings(sets);
            };

            useEffect(() => { fetchData(); }, []);

            const handlePublish = async (e) => {
                e.preventDefault(); setIsPublishing(true);
                try {
                    let fileUrl = null;
                    if (file) {
                        const fileName = `${Date.now()}_${file.name}`;
                        await supabase.storage.from('documents').upload(fileName, file);
                        fileUrl = supabase.storage.from('documents').getPublicUrl(fileName).data.publicUrl;
                    }
                    const payload = { title, type, category, summary, content, tags: tags.split(',').map(t => t.trim()) };
                    if (fileUrl) payload.file_url = fileUrl;
                    
                    if (editingId) await supabase.from('publications').update(payload).eq('id', editingId);
                    else { payload.published_date = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }); await supabase.from('publications').insert([payload]); }
                    
                    setStatusMsg({ type: 'success', text: 'Successfully saved!' });
                    setEditingId(null); setTitle(''); setCategory(''); setSummary(''); setContent(''); setTags(''); setFile(null);
                    fetchData();
                } catch (error) { setStatusMsg({ type: 'error', text: error.message }); }
                setIsPublishing(false);
            };

            const handleSettingsUpdate = async (e) => {
                e.preventDefault(); 
                setSettingsStatus('Saving...');
                try {
                    const { error } = await supabase.from('site_settings').upsert({ id: 1, ...settings });
                    if (error) throw error;
                    setSettingsStatus('Settings Saved Successfully!');
                } catch (error) { setSettingsStatus('Error saving: ' + error.message); }
                setTimeout(() => setSettingsStatus(''), 4000);
            };

            const handleImageUpload = async (e, fieldName) => {
                const img = e.target.files[0];
                if (!img) return;
                setSettingsStatus('Uploading Image...');
                try {
                    const cleanName = img.name.replace(/[^a-zA-Z0-9.\-_]/g, '');
                    const fileName = `${Date.now()}_${cleanName}`;
                    const { error: uploadError } = await supabase.storage.from('images').upload(fileName, img);
                    if (uploadError) throw uploadError;
                    const url = supabase.storage.from('images').getPublicUrl(fileName).data.publicUrl;
                    setSettings(prev => ({ ...prev, [fieldName]: url }));
                    setSettingsStatus('Upload Complete! Now click Save All Settings.');
                } catch (error) { setSettingsStatus('Upload Error: ' + error.message); }
            };

            return (
                <div className="min-h-screen bg-[#0a0a0a] flex animate-fade-in">
                    <div className="w-64 bg-gray-900 border-r border-gray-800 flex flex-col">
                        <div className="p-6 border-b border-gray-800"><h2 className="font-serif font-bold text-white text-xl">Admin Portal</h2></div>
                        <nav className="p-4 space-y-2 flex-1">
                            <button onClick={() => setActiveTab('dashboard')} className={`w-full text-left px-4 py-3 rounded-xl transition ${activeTab==='dashboard'?'bg-emerald-900/30 text-emerald-400':'text-gray-400 hover:bg-gray-800'}`}><i className="fas fa-edit w-6"></i> Content CMS</button>
                            <button onClick={() => setActiveTab('inbox')} className={`w-full text-left px-4 py-3 rounded-xl transition ${activeTab==='inbox'?'bg-emerald-900/30 text-emerald-400':'text-gray-400 hover:bg-gray-800'}`}><i className="fas fa-envelope w-6"></i> Inbox</button>
                            <button onClick={() => setActiveTab('subscribers')} className={`w-full text-left px-4 py-3 rounded-xl transition ${activeTab==='subscribers'?'bg-emerald-900/30 text-emerald-400':'text-gray-400 hover:bg-gray-800'}`}><i className="fas fa-users w-6"></i> Subscribers</button>
                            <button onClick={() => setActiveTab('settings')} className={`w-full text-left px-4 py-3 rounded-xl transition ${activeTab==='settings'?'bg-emerald-900/30 text-emerald-400':'text-gray-400 hover:bg-gray-800'}`}><i className="fas fa-cog w-6"></i> Settings</button>
                        </nav>
                        <button onClick={onLogout} className="m-4 text-left px-4 py-3 text-red-400 hover:bg-red-900/20 rounded-xl"><i className="fas fa-sign-out-alt w-6"></i> Logout</button>
                    </div>

                    <div className="flex-1 p-8 overflow-y-auto">
                        <div className="max-w-5xl mx-auto">
                            {activeTab === 'dashboard' && (
                                <div>
                                    <h1 className="text-2xl font-bold font-serif text-white mb-8">Content CMS</h1>
                                    <form onSubmit={handlePublish} className="bg-gray-900 rounded-2xl border border-gray-800 p-6 mb-8 space-y-4">
                                        <h3 className="text-lg font-bold text-white">{editingId ? 'Edit Post' : 'New Post'}</h3>
                                        <input required type="text" placeholder="Title" value={title} onChange={e=>setTitle(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white" />
                                        <div className="grid grid-cols-2 gap-4">
                                            <select value={type} onChange={e=>setType(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white">
                                                <option value="blog">Blog</option><option value="journal">Journal</option><option value="research">Research</option><option value="book">Book</option><option value="project">Project</option>
                                            </select>
                                            <input type="text" placeholder="Category" value={category} onChange={e=>setCategory(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white" />
                                        </div>
                                        <textarea required rows="2" placeholder="Summary" value={summary} onChange={e=>setSummary(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white"></textarea>
                                        <textarea rows="6" placeholder="Content" value={content} onChange={e=>setContent(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white"></textarea>
                                        <input type="file" onChange={e=>setFile(e.target.files[0])} className="text-gray-400" />
                                        <button type="submit" className="bg-emerald-600 text-white px-6 py-3 rounded-xl font-medium">{isPublishing ? 'Saving...' : 'Publish'}</button>
                                    </form>
                                </div>
                            )}

                            {activeTab === 'settings' && (
                                <div>
                                    <h1 className="text-2xl font-bold text-white mb-8">Settings</h1>
                                    {settingsStatus && <div className="mb-4 text-emerald-400">{settingsStatus}</div>}
                                    <form onSubmit={handleSettingsUpdate} className="bg-gray-900 rounded-2xl border border-gray-800 p-6 space-y-6">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div><label className="text-xs text-gray-500">Display Name</label><input type="text" value={settings.display_name} onChange={e=>setSettings({...settings, display_name: e.target.value})} className="w-full px-4 py-2 rounded-lg bg-gray-800 text-white mt-1" /></div>
                                            <div><label className="text-xs text-gray-500">Short Bio</label><input type="text" value={settings.bio} onChange={e=>setSettings({...settings, bio: e.target.value})} className="w-full px-4 py-2 rounded-lg bg-gray-800 text-white mt-1" /></div>
                                        </div>
                                        <div className="grid grid-cols-2 gap-8">
                                            <div><label className="text-xs text-gray-500 block mb-2">Profile Picture</label><input type="file" accept="image/*" onChange={e=>handleImageUpload(e, 'profile_pic_url')} className="text-gray-400" /></div>
                                            <div><label className="text-xs text-gray-500 block mb-2">Website Logo</label><input type="file" accept="image/*" onChange={e=>handleImageUpload(e, 'logo_url')} className="text-gray-400" /></div>
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div><label className="text-xs text-gray-500">LinkedIn URL</label><input type="text" value={settings.linkedin_url} onChange={e=>setSettings({...settings, linkedin_url: e.target.value})} className="w-full px-4 py-2 rounded-lg bg-gray-800 text-white mt-1" /></div>
                                            <div><label className="text-xs text-gray-500">WhatsApp Number</label><input type="text" value={settings.whatsapp_number} onChange={e=>setSettings({...settings, whatsapp_number: e.target.value})} className="w-full px-4 py-2 rounded-lg bg-gray-800 text-white mt-1" /></div>
                                        </div>
                                        <button type="submit" className="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold">Save All Settings</button>
                                    </form>
                                </div>
                            )}

                            {activeTab === 'inbox' && (
                                <div>
                                    <h1 className="text-2xl font-bold text-white mb-8">Inbox</h1>
                                    {messages.map(m => (
                                        <div key={m.id} className="bg-gray-900 border border-gray-800 p-6 rounded-2xl mb-4">
                                            <h4 className="text-white font-bold">{m.name} ({m.email})</h4>
                                            <p className="text-gray-300 mt-2">{m.message}</p>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [session, setSession] = useState(null);
            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => setSession(session));
                supabase.auth.onAuthStateChange((_event, session) => setSession(session));
            }, []);

            if (!session) return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <form onSubmit={async (e) => { e.preventDefault(); await supabase.auth.signInWithPassword({ email: e.target.email.value, password: e.target.password.value }); }} className="bg-gray-900 p-8 rounded-3xl w-full max-w-md space-y-4">
                        <h2 className="text-2xl font-bold text-white text-center">Admin Login</h2>
                        <input name="email" type="email" placeholder="Email" className="w-full px-4 py-3 rounded-xl bg-gray-800 text-white" />
                        <input name="password" type="password" placeholder="Password" className="w-full px-4 py-3 rounded-xl bg-gray-800 text-white" />
                        <button type="submit" className="w-full bg-emerald-600 text-white py-3 rounded-xl font-medium">Login</button>
                    </form>
                </div>
            );
            return <AdminDashboardView onLogout={() => supabase.auth.signOut()} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
