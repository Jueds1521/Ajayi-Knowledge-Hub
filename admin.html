<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Ajayi Knowledge Hub</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { navy: '#0B1F3A', 'emerald-custom': '#2E8B57' }, fontFamily: { serif: ['Merriweather', 'serif'], sans: ['Inter', 'sans-serif'] } } }
        }
    </script>
    <style>body { background-color: #0a0a0a; color: #F9FAFB; } .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; } @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }</style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const supabaseUrl = 'https://ulqihwnzujncqpexersp.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVscWlod256dWpuY3FwZXhlcnNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNDIxNjMsImV4cCI6MjEwMDgxODE2M30.vvMQLeUtjVmciJxwqVgiFVZjmHlclY0Z-oHngY3SVso';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const AdminDashboardView = ({ onLogout }) => {
            const [activeTab, setActiveTab] = useState('dashboard');
            
            // CMS State
            const [title, setTitle] = useState(''); const [type, setType] = useState('blog'); const [category, setCategory] = useState('');
            const [summary, setSummary] = useState(''); const [content, setContent] = useState(''); const [tags, setTags] = useState('');
            const [file, setFile] = useState(null); const [isPublishing, setIsPublishing] = useState(false); const [editingId, setEditingId] = useState(null);
            
            // Data State
            const [publications, setPublications] = useState([]);
            const [messages, setMessages] = useState([]);
            const [settings, setSettings] = useState({ display_name: '', bio: '', about_text: '', mission_text: '', profile_pic_url: '', logo_url: '', linkedin_url: '', facebook_url: '', orcid_url: '', whatsapp_number: '', views_count: 0, downloads_count: 0 });
            
            // UI State
            const [statusMsg, setStatusMsg] = useState({ type: '', text: '' });
            const [settingsStatus, setSettingsStatus] = useState('');

            const fetchData = async () => {
                const { data: pubs } = await supabase.from('publications').select('*').order('id', { ascending: false });
                if (pubs) setPublications(pubs);
                const { data: msgs } = await supabase.from('messages').select('*').order('created_at', { ascending: false });
                if (msgs) setMessages(msgs);
                const { data: sets } = await supabase.from('site_settings').select('*').eq('id', 1).single();
                if (sets) setSettings(sets);
            };

            useEffect(() => { fetchData(); }, []);

            const handlePublish = async (e) => {
                e.preventDefault(); setIsPublishing(true); setStatusMsg({ type: '', text: '' });
                try {
                    let fileUrl = null;
                    if (file) {
                        const fileName = `${Date.now()}_${file.name}`;
                        await supabase.storage.from('documents').upload(fileName, file);
                        fileUrl = supabase.storage.from('documents').getPublicUrl(fileName).data.publicUrl;
                    }
                    const payload = { title, type, category, summary, content, tags: tags.split(',').map(t => t.trim()) };
                    if (fileUrl) payload.file_url = fileUrl;
                    
                    if (editingId) await supabase.from('publications').update(payload).eq('id', editingId);
                    else { payload.published_date = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }); await supabase.from('publications').insert([payload]); }
                    
                    setStatusMsg({ type: 'success', text: 'Successfully saved!' });
                    setEditingId(null); setTitle(''); setCategory(''); setSummary(''); setContent(''); setTags(''); setFile(null);
                    fetchData();
                } catch (error) { setStatusMsg({ type: 'error', text: error.message }); }
                setIsPublishing(false); setTimeout(() => setStatusMsg({ type: '', text: '' }), 5000);
            };

            const handleDelete = async (id) => {
                if(confirm("Are you sure you want to delete this publication?")) {
                    await supabase.from('publications').delete().eq('id', id);
                    fetchData();
                }
            };

            const handleDeleteMessage = async (id) => {
                if(confirm("Delete this message?")) {
                    await supabase.from('messages').delete().eq('id', id);
                    fetchData();
                }
            };

            const handleMarkRead = async (id) => {
                await supabase.from('messages').update({read_status: true}).eq('id', id);
                fetchData();
            };

            const handleSettingsUpdate = async (e) => {
                e.preventDefault(); setSettingsStatus('Saving...');
                await supabase.from('site_settings').update(settings).eq('id', 1);
                setSettingsStatus('Settings Saved!');
                setTimeout(() => setSettingsStatus(''), 3000);
            };

            const handleImageUpload = async (e, fieldName) => {
                const img = e.target.files[0];
                if (!img) return;
                setSettingsStatus('Uploading Image...');
                const fileName = `${Date.now()}_${img.name}`;
                await supabase.storage.from('images').upload(fileName, img);
                const url = supabase.storage.from('images').getPublicUrl(fileName).data.publicUrl;
                setSettings({ ...settings, [fieldName]: url });
                setSettingsStatus('Upload Complete. Click Save Settings below.');
            };

            return (
                <div className="min-h-screen bg-[#0a0a0a] flex animate-fade-in">
                    <div className="w-64 bg-gray-900 border-r border-gray-800 flex flex-col">
                        <div className="p-6 border-b border-gray-800"><h2 className="font-serif font-bold text-white text-xl">Admin Portal</h2></div>
                        <nav className="p-4 space-y-2 flex-1">
                            <button onClick={() => setActiveTab('dashboard')} className={`w-full text-left px-4 py-3 rounded-xl transition ${activeTab==='dashboard'?'bg-emerald-900/30 text-emerald-400':'text-gray-400 hover:bg-gray-800'}`}><i className="fas fa-edit w-6"></i> Content CMS</button>
                            <button onClick={() => setActiveTab('inbox')} className={`w-full text-left px-4 py-3 rounded-xl transition flex justify-between items-center ${activeTab==='inbox'?'bg-emerald-900/30 text-emerald-400':'text-gray-400 hover:bg-gray-800'}`}>
                                <span><i className="fas fa-envelope w-6"></i> Inbox</span>
                                {messages.filter(m => !m.read_status).length > 0 && <span className="bg-emerald-500 text-white text-xs px-2 py-0.5 rounded-full">{messages.filter(m => !m.read_status).length}</span>}
                            </button>
                            <button onClick={() => setActiveTab('settings')} className={`w-full text-left px-4 py-3 rounded-xl transition ${activeTab==='settings'?'bg-emerald-900/30 text-emerald-400':'text-gray-400 hover:bg-gray-800'}`}><i className="fas fa-cog w-6"></i> Profile Settings</button>
                        </nav>
                        <button onClick={onLogout} className="m-4 text-left px-4 py-3 text-red-400 hover:bg-red-900/20 rounded-xl"><i className="fas fa-sign-out-alt w-6"></i> Logout</button>
                    </div>

                    <div className="flex-1 p-8 overflow-y-auto">
                        <div className="max-w-5xl mx-auto">
                            
                            {activeTab === 'dashboard' && (
                                <div>
                                    <h1 className="text-2xl font-bold font-serif text-white mb-8">Content CMS</h1>
                                    <div className="bg-gray-900 rounded-2xl border border-gray-800 p-6 mb-8">
                                        <h3 className="text-lg font-bold text-white mb-6">{editingId ? 'Edit Post' : 'New Post'}</h3>
                                        {statusMsg.text && <div className="mb-4 p-3 bg-emerald-900/30 text-emerald-400 border border-emerald-800 rounded">{statusMsg.text}</div>}
                                        <form onSubmit={handlePublish} className="space-y-4">
                                            <div className="grid grid-cols-2 gap-4">
                                                <input required type="text" placeholder="Title" value={title} onChange={e=>setTitle(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white" />
                                                <select value={type} onChange={e=>setType(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white">
                                                    <option value="blog">Blog</option><option value="journal">Journal</option><option value="research">Research</option><option value="book">Book</option><option value="teaching">Teaching</option><option value="project">Project</option>
                                                </select>
                                                <input type="text" placeholder="Category (e.g. Microbiology)" value={category} onChange={e=>setCategory(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white" />
                                                <input type="text" placeholder="Tags (comma separated)" value={tags} onChange={e=>setTags(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white" />
                                            </div>
                                            <textarea required rows="2" placeholder="Summary" value={summary} onChange={e=>setSummary(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white resize-none"></textarea>
                                            <textarea rows="6" placeholder="Full Content" value={content} onChange={e=>setContent(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white resize-none"></textarea>
                                            <div className="flex justify-between items-center bg-gray-800 p-4 rounded-xl">
                                                <input type="file" accept=".pdf" onChange={e=>setFile(e.target.files[0])} className="text-sm text-gray-400" />
                                                <button type="submit" disabled={isPublishing} className="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2 rounded-xl">{isPublishing ? 'Saving...' : 'Publish'}</button>
                                            </div>
                                        </form>
                                    </div>

                                    <div className="bg-gray-900 rounded-2xl border border-gray-800 p-6">
                                        <h3 className="text-lg font-bold text-white mb-6">Published Content</h3>
                                        <table className="w-full text-left text-sm text-gray-400">
                                            <thead><tr className="border-b border-gray-800"><th className="pb-3">Title</th><th className="pb-3">Type</th><th className="pb-3">Actions</th></tr></thead>
                                            <tbody>
                                                {publications.map(p => (
                                                    <tr key={p.id} className="border-b border-gray-800/50">
                                                        <td className="py-3 text-white">{p.title}</td><td className="py-3 uppercase text-xs">{p.type}</td>
                                                        <td className="py-3 flex gap-3">
                                                            <button onClick={() => { setEditingId(p.id); setTitle(p.title); setType(p.type); setCategory(p.category); setSummary(p.summary); setContent(p.content); setTags(p.tags.join(', ')); }} className="text-blue-400 hover:text-white">Edit</button>
                                                            <button onClick={() => handleDelete(p.id)} className="text-red-400 hover:text-white">Delete</button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'inbox' && (
                                <div>
                                    <h1 className="text-2xl font-bold font-serif text-white mb-8">Messages Inbox</h1>
                                    <div className="space-y-4">
                                        {messages.length === 0 ? <p className="text-gray-500">No messages yet.</p> : messages.map(m => (
                                            <div key={m.id} className={`bg-gray-900 border ${m.read_status ? 'border-gray-800' : 'border-emerald-500'} p-6 rounded-2xl`}>
                                                <div className="flex justify-between items-start mb-4">
                                                    <div><h4 className="text-white font-bold">{m.name}</h4><a href={`mailto:${m.email}`} className="text-emerald-400 text-sm">{m.email}</a></div>
                                                    <div className="text-right">
                                                        <span className="text-gray-500 text-xs block mb-2">{new Date(m.created_at).toLocaleDateString()}</span>
                                                        <div className="flex gap-2">
                                                            {!m.read_status && <button onClick={()=>handleMarkRead(m.id)} className="text-xs bg-gray-800 px-2 py-1 rounded text-white hover:bg-gray-700">Mark Read</button>}
                                                            <button onClick={()=>handleDeleteMessage(m.id)} className="text-xs bg-red-900/30 px-2 py-1 rounded text-red-400 hover:bg-red-900/60">Delete</button>
                                                        </div>
                                                    </div>
                                                </div>
                                                <p className="text-gray-300 bg-gray-800/50 p-4 rounded-lg whitespace-pre-wrap">{m.message}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {activeTab === 'settings' && (
                                <div>
                                    <div className="flex justify-between items-center mb-8">
                                        <h1 className="text-2xl font-bold font-serif text-white">Profile & Platform Settings</h1>
                                        {settingsStatus && <span className="bg-emerald-900/30 text-emerald-400 px-4 py-2 rounded-lg text-sm border border-emerald-800">{settingsStatus}</span>}
                                    </div>
                                    <form onSubmit={handleSettingsUpdate} className="space-y-8">
                                        {/* Basic Info */}
                                        <div className="bg-gray-900 rounded-2xl border border-gray-800 p-6 space-y-4">
                                            <h3 className="text-lg font-bold text-white border-b border-gray-800 pb-2 mb-4">About You</h3>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div><label className="text-xs text-gray-500">Display Name</label><input type="text" value={settings.display_name} onChange={e=>setSettings({...settings, display_name: e.target.value})} className="w-full px-4 py-2 rounded-lg bg-gray-800 border-none text-white mt-1" /></div>
                                                <div><label className="text-xs text-gray-500">Short Bio</label><input type="text" value={settings.bio} onChange={e=>setSettings({...settings, bio: e.target.value})} className="w-full px-4 py-2 rounded-lg bg-gray-800 border-none text-white mt-1" /></div>
                                            </div>
                                            <div><label className="text-xs text-gray-500">Mission Statement</label><input type="text" value={settings.mission_text} onChange={e=>setSettings({...settings, mission_text: e.target.value})} className="w-full px-4 py-2 rounded-lg bg-gray-800 border-none text-white mt-1" /></div>
                                            <div><label className="text-xs text-gray-500">Full About Text</label><textarea rows="4" value={settings.about_text} onChange={e=>setSettings({...settings, about_text: e.target.value})} className="w-full px-4 py-2 rounded-lg bg-gray-800 border-none text-white mt-1 resize-none"></textarea></div>
                                        </div>

                                        {/* Images */}
                                        <div className="bg-gray-900 rounded-2xl border border-gray-800 p-6 space-y-4">
                                            <h3 className="text-lg font-bold text-white border-b border-gray-800 pb-2 mb-4">Images</h3>
                                            <div className="grid grid-cols-2 gap-8">
                                                <div>
                                                    <label className="text-xs text-gray-500 block mb-2">Profile Picture</label>
                                                    {settings.profile_pic_url && <img src={settings.profile_pic_url} className="h-20 w-20 rounded-xl object-cover mb-2 border border-gray-700" />}
                                                    <input type="file" accept="image/*" onChange={e=>handleImageUpload(e, 'profile_pic_url')} className="text-sm text-gray-400" />
                                                </div>
                                                <div>
                                                    <label className="text-xs text-gray-500 block mb-2">Website Logo</label>
                                                    {settings.logo_url && <img src={settings.logo_url} className="h-12 w-12 rounded-xl object-cover mb-2 border border-gray-700" />}
                                                    <input type="file" accept="image/*" onChange={e=>handleImageUpload(e, 'logo_url')} className="text-sm text-gray-400" />
                                                </div>
                                            </div>
                                        </div>

                                        {/* Social Links */}
                                        <div className="bg-gray-900 rounded-2xl border border-gray-800 p-6 space-y-4">
                                            <h3 className="text-lg font-bold text-white border-b border-gray-800 pb-2 mb-4">Social & Contact Links</h3>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div><label className="text-xs text-gray-500"><i className="fab fa-linkedin text-blue-500"></i> LinkedIn URL</label><input type="text" placeholder="https://linkedin.com/in/..." value={settings.linkedin_url} onChange={e=>setSettings({...settings, linkedin_url: e.target.value})} className="w-full px-4 py-2 rounded-lg bg-gray-800 border-none text-white mt-1" /></div>
                                                <div><label className="text-xs text-gray-500"><i className="fab fa-orcid text-green-500"></i> ORCID URL</label><input type="text" placeholder="https://orcid.org/..." value={settings.orcid_url} onChange={e=>setSettings({...settings, orcid_url: e.target.value})} className="w-full px-4 py-2 rounded-lg bg-gray-800 border-none text-white mt-1" /></div>
                                                <div><label className="text-xs text-gray-500"><i className="fab fa-facebook text-blue-600"></i> Facebook URL</label><input type="text" placeholder="https://facebook.com/..." value={settings.facebook_url} onChange={e=>setSettings({...settings, facebook_url: e.target.value})} className="w-full px-4 py-2 rounded-lg bg-gray-800 border-none text-white mt-1" /></div>
                                                <div><label className="text-xs text-gray-500"><i className="fab fa-whatsapp text-green-400"></i> WhatsApp Number</label><input type="text" placeholder="e.g. +1234567890" value={settings.whatsapp_number} onChange={e=>setSettings({...settings, whatsapp_number: e.target.value})} className="w-full px-4 py-2 rounded-lg bg-gray-800 border-none text-white mt-1" /></div>
                                            </div>
                                        </div>

                                        <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-4 rounded-xl font-bold text-lg shadow-lg">Save All Settings</button>
                                    </form>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [session, setSession] = useState(null);
            
            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => setSession(session));
                supabase.auth.onAuthStateChange((_event, session) => setSession(session));
            }, []);

            if (!session) return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="bg-gray-900 border border-gray-800 p-8 rounded-3xl shadow-2xl w-full max-w-md">
                        <h2 className="text-2xl font-bold font-serif text-white text-center mb-8">Admin Login</h2>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            await supabase.auth.signInWithPassword({ email: e.target.email.value, password: e.target.password.value });
                        }} className="space-y-4">
                            <input name="email" type="email" placeholder="Email" required className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white" />
                            <input name="password" type="password" placeholder="Password" required className="w-full px-4 py-3 rounded-xl bg-gray-800 border-none text-white" />
                            <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-medium">Login</button>
                        </form>
                    </div>
                </div>
            );
            return <AdminDashboardView onLogout={() => supabase.auth.signOut()} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
